<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Certificate | 0X1GHOST</title>

    <link
        rel="icon"
        type="image/png"
        href="favicon.png"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at center,
                    #101010 0%,
                    #050505 55%,
                    #020202 100%
                );

            color: white;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px;
        }

        .certificate-wrapper {
            width: 100%;
            max-width: 1100px;
        }

        .certificate {
            position: relative;

            width: 100%;

            aspect-ratio: 1.414 / 1;

            background:
                linear-gradient(
                    145deg,
                    #0d0d0d,
                    #070707
                );

            border: 1px solid #333;

            overflow: hidden;

            box-shadow:
                0 0 80px
                rgba(0, 255, 136, 0.08);
        }

        .certificate::before {
            content: "";

            position: absolute;

            inset: 14px;

            border: 1px solid
                rgba(0, 255, 136, 0.35);
        }

        .corner {
            position: absolute;

            width: 45px;
            height: 45px;

            border-color: #00ff88;

            opacity: 0.8;
        }

        .top-left {
            top: 28px;
            left: 28px;

            border-top: 2px solid;
            border-left: 2px solid;
        }

        .top-right {
            top: 28px;
            right: 28px;

            border-top: 2px solid;
            border-right: 2px solid;
        }

        .bottom-left {
            bottom: 28px;
            left: 28px;

            border-bottom: 2px solid;
            border-left: 2px solid;
        }

        .bottom-right {
            bottom: 28px;
            right: 28px;

            border-bottom: 2px solid;
            border-right: 2px solid;
        }

        .content {
            position: relative;

            z-index: 2;

            height: 100%;

            display: flex;
            flex-direction: column;

            align-items: center;

            justify-content: center;

            text-align: center;

            padding: 60px;
        }

        .brand {
            color: #00ff88;

            font-size: 16px;

            font-weight: bold;

            letter-spacing: 7px;

            margin-bottom: 25px;
        }

        .certificate-title {
            font-size: clamp(
                38px,
                6vw,
                72px
            );

            font-weight: 800;

            letter-spacing: 8px;

            margin-bottom: 12px;
        }

        .certificate-subtitle {
            color: #777;

            font-size: 13px;

            letter-spacing: 4px;

            text-transform: uppercase;

            margin-bottom: 45px;
        }

        .presented {
            color: #777;

            font-size: 13px;

            letter-spacing: 2px;

            margin-bottom: 12px;
        }

        .username {
            color: #00ff88;

            font-size: clamp(
                28px,
                4vw,
                48px
            );

            font-weight: bold;

            letter-spacing: 2px;

            margin-bottom: 20px;

            text-shadow:
                0 0 25px
                rgba(0, 255, 136, 0.25);
        }

        .achievement {
            color: #aaa;

            font-size: 15px;

            line-height: 1.7;

            max-width: 650px;

            margin-bottom: 35px;
        }

        .achievement strong {
            color: white;
        }

        .stats {
            display: flex;

            align-items: center;

            justify-content: center;

            gap: 70px;

            margin-bottom: 45px;
        }

        .stat {
            min-width: 100px;
        }

        .stat-value {
            color: #00ff88;

            font-size: 25px;

            font-weight: bold;

            margin-bottom: 7px;
        }

        .stat-label {
            color: #666;

            font-size: 10px;

            letter-spacing: 2px;

            text-transform: uppercase;
        }

        .footer {
            width: 100%;

            display: flex;

            align-items: flex-end;

            justify-content: space-between;

            gap: 30px;
        }

        .footer-block {
            text-align: left;
        }

        .footer-block.right {
            text-align: right;
        }

        .footer-label {
            color: #555;

            font-size: 9px;

            letter-spacing: 2px;

            margin-bottom: 6px;

            text-transform: uppercase;
        }

        .footer-value {
            color: #aaa;

            font-size: 11px;

            font-family: monospace;
        }

        .signature {
            color: white;

            font-family: cursive;

            font-size: 24px;

            margin-bottom: 3px;
        }

        .error {
            text-align: center;

            color: #ff6b6b;

            padding: 40px;

            font-size: 16px;
        }

        .print-button {
            margin-top: 25px;

            background: #00ff88;

            color: #050505;

            border: none;

            padding: 12px 22px;

            border-radius: 6px;

            font-weight: bold;

            cursor: pointer;
        }

        @media print {

            body {
                background: white;

                padding: 0;
            }

            .certificate {
                box-shadow: none;

                print-color-adjust: exact;

                -webkit-print-color-adjust: exact;
            }

            .print-button {
                display: none;
            }

        }

    </style>

</head>

<body>

<div class="certificate-wrapper">

    <div
        id="certificateContainer"
        class="certificate"
    >

        <div class="corner top-left"></div>
        <div class="corner top-right"></div>
        <div class="corner bottom-left"></div>
        <div class="corner bottom-right"></div>

        <div class="content">

            <div class="brand">
                0X1GHOST
            </div>

            <h1 class="certificate-title">
                CERTIFICATE
            </h1>

            <div class="certificate-subtitle">
                Monthly CTF Achievement
            </div>

            <div class="presented">
                THIS CERTIFICATE IS PROUDLY AWARDED TO
            </div>

            <div
                id="username"
                class="username"
            >
                LOADING...
            </div>

            <div
                id="achievement"
                class="achievement"
            >
                Loading certificate...
            </div>

            <div class="stats">

                <div class="stat">

                    <div
                        id="rank"
                        class="stat-value"
                    >
                        -
                    </div>

                    <div class="stat-label">
                        Rank
                    </div>

                </div>

                <div class="stat">

                    <div
                        id="points"
                        class="stat-value"
                    >
                        -
                    </div>

                    <div class="stat-label">
                        Points
                    </div>

                </div>

                <div class="stat">

                    <div
                        id="season"
                        class="stat-value"
                    >
                        -
                    </div>

                    <div class="stat-label">
                        Season
                    </div>

                </div>

            </div>

            <div class="footer">

                <div class="footer-block">

                    <div class="footer-label">
                        Certificate ID
                    </div>

                    <div
                        id="certificateId"
                        class="footer-value"
                    >
                        -
                    </div>

                </div>

                <div class="footer-block right">

                    <div class="signature">
                        MR & AHMED
                    </div>

                    <div class="footer-label">
                        ADMINS & FOUNDERS
                    </div>

                </div>

            </div>

        </div>

    </div>

    <div style="text-align:center;">

        <button
            class="print-button"
            onclick="window.print()"
        >
            PRINT / SAVE AS PDF
        </button>

    </div>

</div>


<script type="module">

import {
    createClient
}
from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


const SUPABASE_URL =
"https://borturaxifoxufixewya.supabase.co";


const SUPABASE_KEY =
"sb_publishable__lZmTM96oe10-rurqgrujg__ta_C4wr";


const supabase =
createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


const usernameElement =
document.getElementById(
    "username"
);


const achievementElement =
document.getElementById(
    "achievement"
);


const rankElement =
document.getElementById(
    "rank"
);


const pointsElement =
document.getElementById(
    "points"
);


const seasonElement =
document.getElementById(
    "season"
);


const certificateIdElement =
document.getElementById(
    "certificateId"
);


const params =
new URLSearchParams(
    window.location.search
);


const certificateId =
params.get(
    "id"
);


async function loadCertificate() {

    if (!certificateId) {

        showError(
            "Certificate ID is missing."
        );

        return;

    }


    const {
        data,
        error
    } = await supabase

        .from("monthly_winners")

        .select(`
            username,
            score,
            rank,
            certificate_id,
            competition_id,
            monthly_competitions (
                title,
                month_start
            )
        `)

        .eq(
            "certificate_id",
            certificateId
        )

        .maybeSingle();


    if (error) {

        console.error(error);

        showError(
            "Unable to load certificate."
        );

        return;

    }


    if (!data) {

        showError(
            "Certificate not found."
        );

        return;

    }


    const competition =
        data.monthly_competitions;


    const month =
        new Date(
            competition.month_start +
            "T00:00:00"
        );


    const monthName =
        month.toLocaleDateString(
            "en-US",
            {
                month: "long",
                year: "numeric"
            }
        );


    usernameElement.textContent =
        data.username;


    rankElement.textContent =
        "#" + data.rank;


    pointsElement.textContent =
        Number(
            data.score
        ).toLocaleString();


    seasonElement.textContent =
        month.toLocaleDateString(
            "en-US",
            {
                month: "short",
                year: "numeric"
            }
        )
        .toUpperCase();


    certificateIdElement.textContent =
        data.certificate_id;


    achievementElement.innerHTML =
        `For achieving <strong>${escapeHTML(
            ordinal(data.rank)
        )} Place</strong> in the <strong>${escapeHTML(
            monthName
        )}</strong> 0X1GHOST Monthly CTF Competition.`;


    document.title =
        "Certificate - " +
        data.username +
        " | 0X1GHOST";

}


function ordinal(number) {

    const n =
        Number(number);

    if (
        n % 100 >= 11 &&
        n % 100 <= 13
    ) {
        return n + "th";
    }

    switch (
        n % 10
    ) {

        case 1:
            return n + "st";

        case 2:
            return n + "nd";

        case 3:
            return n + "rd";

        default:
            return n + "th";

    }

}


function escapeHTML(value) {

    return String(
        value ?? ""
    )

    .replaceAll(
        "&",
        "&amp;"
    )

    .replaceAll(
        "<",
        "&lt;"
    )

    .replaceAll(
        ">",
        "&gt;"
    )

    .replaceAll(
        '"',
        "&quot;"
    )

    .replaceAll(
        "'",
        "&#039;"
    );

}


function showError(text) {

    document.getElementById(
        "certificateContainer"
    ).innerHTML = `

        <div class="error">
            ${escapeHTML(text)}
        </div>

    `;

}


loadCertificate();

</script>

</body>

</html>
