<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | 0X1GHOST</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #050505;
            color: white;
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .card {
            background: #0d0d0d;
            border: 1px solid #222;
            border-radius: 12px;
            padding: 40px 35px;
            box-shadow:
                0 0 35px rgba(0, 255, 136, 0.08);
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 3px;
            color: #00ff88;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-bottom: 35px;
        }

        .title {
            text-align: center;
            font-size: 22px;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #aaa;
            font-size: 14px;
        }

        .input-group input {
            width: 100%;
            padding: 13px 14px;
            background: #080808;
            border: 1px solid #292929;
            border-radius: 7px;
            color: white;
            outline: none;
            font-size: 15px;
            transition: 0.2s;
        }

        .input-group input:focus {
            border-color: #00ff88;
            box-shadow:
                0 0 8px rgba(0, 255, 136, 0.15);
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            margin-top: 8px;
            border: none;
            border-radius: 7px;
            background: #00ff88;
            color: #050505;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .login-btn:hover {
            background: #00e67a;
            transform: translateY(-1px);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        #message {
            text-align: center;
            margin-top: 18px;
            font-size: 14px;
            min-height: 20px;
            line-height: 1.5;
        }

        .register-link {
            text-align: center;
            margin-top: 25px;
            color: #777;
            font-size: 14px;
        }

        .register-link a {
            color: #00ff88;
            text-decoration: none;
            font-weight: bold;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {

            .card {
                padding: 30px 22px;
            }

            .logo {
                font-size: 24px;
            }

        }

    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <div class="logo">
            0X1GHOST
        </div>

        <div class="subtitle">
            CRYPTOGRAPHY CHALLENGE PLATFORM
        </div>

        <div class="title">
            Login
        </div>

        <form id="loginForm">

            <div class="input-group">

                <label for="loginValue">
                    Username or Email
                </label>

                <input
                    type="text"
                    id="loginValue"
                    placeholder="Enter your username or email"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="input-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-btn"
                id="loginButton"
            >
                LOGIN
            </button>

        </form>


        <div id="message"></div>


        <div class="register-link">

            Don't have an account?

            <a href="register.html">
                Register
            </a>

        </div>

    </div>

</div>


<script type="module">

    import {
        createClient
    } from
    "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


    /* =====================================================
       SUPABASE
       ===================================================== */

    const SUPABASE_URL =
        "https://borturaxifoxufixewya.supabase.co";


    const SUPABASE_KEY =
        "sb_publishable__lZmTM96oe10-rurqgrujg__ta_C4wr";


    const supabase =
        createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    /* =====================================================
       ELEMENTS
       ===================================================== */

    const form =
        document.getElementById(
            "loginForm"
        );


    const loginValueInput =
        document.getElementById(
            "loginValue"
        );


    const passwordInput =
        document.getElementById(
            "password"
        );


    const message =
        document.getElementById(
            "message"
        );


    const button =
        document.getElementById(
            "loginButton"
        );


    /* =====================================================
       MESSAGE HELPER
       ===================================================== */

    function showMessage(
        text,
        color
    ) {

        message.textContent = text;
        message.style.color = color;

    }


    /* =====================================================
       LOGIN
       ===================================================== */

    form.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const loginValue =
                loginValueInput
                    .value
                    .trim();


            const password =
                passwordInput.value;


            showMessage(
                "",
                "#ff6b6b"
            );


            /* =============================================
               VALIDATION
               ============================================= */

            if (
                loginValue === "" ||
                password === ""
            ) {

                showMessage(
                    "Please enter your username or email and password.",
                    "#ff6b6b"
                );

                return;

            }


            /* =============================================
               DISABLE BUTTON
               ============================================= */

            button.disabled = true;

            button.textContent =
                "LOGGING IN...";


            try {

                /* =========================================
                   FIND EMAIL
                   
                   Supports:
                   - Username
                   - Email
                   ========================================= */

                const {
                    data: email,
                    error: lookupError
                } = await supabase.rpc(
                    "get_login_email",
                    {
                        p_login: loginValue
                    }
                );


                if (lookupError) {

                    console.error(
                        "Login lookup error:",
                        lookupError
                    );

                    showMessage(
                        "Login service unavailable. Please try again.",
                        "#ff6b6b"
                    );

                    button.disabled = false;
                    button.textContent = "LOGIN";

                    return;

                }


                /* =========================================
                   USER NOT FOUND
                   ========================================= */

                if (!email) {

                    showMessage(
                        "User not found.",
                        "#ff6b6b"
                    );

                    button.disabled = false;
                    button.textContent = "LOGIN";

                    return;

                }


                /* =========================================
                   SIGN IN WITH SUPABASE AUTH
                   ========================================= */

                const {
                    data,
                    error
                } =
                await supabase.auth
                    .signInWithPassword({

                        email: email,

                        password: password

                    });


                /* =========================================
                   INVALID PASSWORD
                   ========================================= */

                if (error) {

                    console.error(
                        "Login error:",
                        error
                    );


                    const errorMessage =
                        (
                            error.message ||
                            ""
                        ).toLowerCase();


                    if (
                        errorMessage.includes(
                            "invalid login credentials"
                        )
                    ) {

                        showMessage(
                            "Incorrect password.",
                            "#ff6b6b"
                        );

                    } else {

                        showMessage(
                            error.message ||
                            "Login failed.",
                            "#ff6b6b"
                        );

                    }


                    button.disabled = false;

                    button.textContent =
                        "LOGIN";

                    return;

                }


                /* =========================================
                   CHECK USER
                   ========================================= */

                if (
                    !data ||
                    !data.user
                ) {

                    showMessage(
                        "Login failed.",
                        "#ff6b6b"
                    );

                    button.disabled = false;

                    button.textContent =
                        "LOGIN";

                    return;

                }


                /* =========================================
                   SUCCESS
                   ========================================= */

                showMessage(
                    "Login successful!",
                    "#00ff88"
                );


                button.textContent =
                    "SUCCESS";


                /* =========================================
                   REDIRECT
                   ========================================= */

                setTimeout(
                    function() {

                        window.location.href =
                            "dashboard.html";

                    },
                    700
                );


            } catch (error) {

                console.error(
                    "Unexpected login error:",
                    error
                );


                showMessage(
                    "Login failed. Please try again.",
                    "#ff6b6b"
                );


                button.disabled = false;

                button.textContent =
                    "LOGIN";

            }

        }
    );

</script>

</body>
</html>
