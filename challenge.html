```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Challenge | 0X1GHOST</title>

    <!-- FAVICON -->
    <link
        rel="icon"
        type="image/png"
        href="favicon.png"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }


        body {
            min-height: 100vh;
            background: #050505;
            color: white;
        }


        /* NAVBAR */

        .navbar {
            min-height: 70px;

            border-bottom: 1px solid #222;

            background: #090909;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 12px 35px;

            gap: 20px;
        }


        /* LOGO */

        .logo {
            display: flex;
            align-items: center;
        }


        .logo img {
            display: block;

            width: 150px;

            max-height: 55px;

            object-fit: contain;
        }


        /* BACK */

        .back {
            color: #aaa;

            text-decoration: none;

            font-weight: bold;

            font-size: 13px;

            transition: 0.2s;
        }


        .back:hover {
            color: #00ff88;
        }


        /* MAIN */

        .container {
            width: 100%;

            max-width: 900px;

            margin: auto;

            padding: 50px 25px;
        }


        .challenge {
            background: #0d0d0d;

            border: 1px solid #222;

            border-radius: 12px;

            padding: 35px;
        }


        /* TOP */

        .top {
            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;

            margin-bottom: 25px;
        }


        .title {
            font-size: 30px;
        }


        .badge {
            border: 1px solid #00ff88;

            color: #00ff88;

            padding: 7px 10px;

            border-radius: 5px;

            font-size: 12px;

            font-weight: bold;

            white-space: nowrap;
        }


        /* DESCRIPTION */

        .description {
            color: #999;

            line-height: 1.7;

            margin-bottom: 25px;
        }


        /* MESSAGE BOX */

        .message-box {
            background: #070707;

            border: 1px solid #222;

            border-radius: 8px;

            padding: 25px;

            margin-bottom: 25px;
        }


        .message-title {
            color: #777;

            font-size: 12px;

            font-weight: bold;

            margin-bottom: 12px;
        }


        /* MESSAGE + COPY */

        .message-row {
            display: flex;

            align-items: center;

            gap: 12px;
        }


        .message {
            color: #00ff88;

            font-family: monospace;

            font-size: 18px;

            word-break: break-word;

            flex: 1;
        }


        .copy-btn {
            background: transparent;

            border: 1px solid #333;

            color: #aaa;

            padding: 8px 12px;

            border-radius: 6px;

            cursor: pointer;

            font-size: 12px;

            font-weight: bold;

            transition: 0.2s;

            white-space: nowrap;
        }


        .copy-btn:hover {
            border-color: #00ff88;

            color: #00ff88;
        }


        /* ANSWER */

        .answer-label {
            display: block;

            color: #aaa;

            font-size: 13px;

            margin-bottom: 8px;
        }


        .answer-input {
            width: 100%;

            padding: 13px;

            background: #070707;

            border: 1px solid #333;

            border-radius: 7px;

            color: white;

            outline: none;

            font-size: 15px;
        }


        .answer-input:focus {
            border-color: #00ff88;
        }


        /* SUBMIT */

        .submit-btn {
            margin-top: 15px;

            padding: 12px 20px;

            background: #00ff88;

            border: none;

            border-radius: 7px;

            color: #050505;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }


        .submit-btn:hover {
            box-shadow:
                0 0 20px rgba(0, 255, 136, 0.15);
        }


        .submit-btn:disabled {
            opacity: 0.5;

            cursor: not-allowed;
        }


        /* RESULT */

        .result {
            margin-top: 20px;

            padding: 14px;

            border-radius: 7px;

            display: none;

            line-height: 1.5;
        }


        .success {
            display: block;

            color: #00ff88;

            border: 1px solid #00ff88;

            background: rgba(0, 255, 136, 0.05);
        }


        .error {
            display: block;

            color: #ff6b6b;

            border: 1px solid #ff6b6b;

            background: rgba(255, 107, 107, 0.05);
        }


        .points {
            color: #00ff88;

            font-weight: bold;
        }


        /* MOBILE */

        @media (max-width: 600px) {

            .navbar {
                padding: 15px 18px;
            }


            .logo img {
                width: 125px;
            }


            .container {
                padding: 30px 18px;
            }


            .challenge {
                padding: 25px;
            }


            .top {
                flex-direction: column;

                align-items: flex-start;
            }


            .message-row {
                align-items: flex-start;

                flex-direction: column;
            }


            .copy-btn {
                width: 100%;
            }

        }

    </style>

</head>


<body>


<!-- NAVBAR -->

<nav class="navbar">


    <a
        href="dashboard.html"
        class="logo"
    >

        <img
            src="logo.png"
            alt="0X1GHOST Logo"
        >

    </a>


    <a
        href="challenges.html"
        class="back"
    >

        ← BACK TO CHALLENGES

    </a>


</nav>


<!-- MAIN -->

<main class="container">


    <div class="challenge">


        <!-- TOP -->

        <div class="top">


            <h1
                class="title"
                id="challengeName"
            >
                Loading...
            </h1>


            <div
                class="badge"
                id="challengeBadge"
            >
                ...
            </div>


        </div>


        <!-- DESCRIPTION -->

        <p
            class="description"
            id="challengeDescription"
        >
            Loading challenge...
        </p>


        <!-- ENCRYPTED MESSAGE -->

        <div class="message-box">


            <div class="message-title">
                ENCRYPTED MESSAGE
            </div>


            <div class="message-row">


                <div
                    class="message"
                    id="challengeMessage"
                >
                    Loading...
                </div>


                <button
                    type="button"
                    class="copy-btn"
                    id="copyButton"
                >
                    COPY
                </button>


            </div>


        </div>


        <!-- ANSWER -->

        <form id="answerForm">


            <label
                class="answer-label"
                for="answer"
            >
                YOUR ANSWER
            </label>


            <input
                id="answer"
                class="answer-input"
                type="text"
                autocomplete="off"
                placeholder="Enter your answer..."
                required
            >


            <button
                class="submit-btn"
                id="submitButton"
                type="submit"
            >
                SUBMIT ANSWER
            </button>


        </form>


        <!-- RESULT -->

        <div
            id="result"
            class="result"
        ></div>


    </div>


</main>


<script type="module">


    /* ============================================
       SUPABASE
    ============================================ */


    import {
        createClient
    }
    from
    "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


    const SUPABASE_URL =
        "https://borturaxifoxufixewya.supabase.co";


    const SUPABASE_KEY =
        "sb_publishable__lZmTM96oe10-rurqgrujg__ta_C4wr";


    const supabase =
        createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );



    /* ============================================
       CHALLENGES
    ============================================ */


    const challenges = {


        caesar: {

            name:
                "Caesar's Secret",

            difficulty:
                "EASY · 100 PTS",

            points:
                100,

            description:
                "Caesar has hidden a secret message using a classical Caesar cipher. Decode the message and submit the plaintext.",

            message:
                "FDHVDU",

            answer:
                "0X1GHOST{CAESAR}"

        },


        "coming-medium": {

            name:
                "Coming Soon",

            difficulty:
                "MEDIUM · 200 PTS",

            points:
                200,

            description:
                "This challenge is currently being prepared.",

            message:
                "COMING SOON",

            answer:
                ""

        },


        "coming-medium-hard": {

            name:
                "Coming Soon",

            difficulty:
                "MEDIUM HARD · 300 PTS",

            points:
                300,

            description:
                "This challenge is currently being prepared.",

            message:
                "COMING SOON",

            answer:
                ""

        },


        "coming-hard": {

            name:
                "Coming Soon",

            difficulty:
                "HARD · 500 PTS",

            points:
                500,

            description:
                "This challenge is currently being prepared.",

            message:
                "COMING SOON",

            answer:
                ""

        }

    };



    /* ============================================
       GET CHALLENGE ID
    ============================================ */


    const params =
        new URLSearchParams(
            window.location.search
        );


    const challengeId =
        params.get("id");


    const challenge =
        challenges[challengeId];



    /* ============================================
       ELEMENTS
    ============================================ */


    const challengeName =
        document.getElementById(
            "challengeName"
        );


    const challengeBadge =
        document.getElementById(
            "challengeBadge"
        );


    const challengeDescription =
        document.getElementById(
            "challengeDescription"
        );


    const challengeMessage =
        document.getElementById(
            "challengeMessage"
        );


    const answerForm =
        document.getElementById(
            "answerForm"
        );


    const answerInput =
        document.getElementById(
            "answer"
        );


    const result =
        document.getElementById(
            "result"
        );


    const copyButton =
        document.getElementById(
            "copyButton"
        );


    const submitButton =
        document.getElementById(
            "submitButton"
        );



    /* ============================================
       LOAD CHALLENGE
    ============================================ */


    if (!challenge) {


        challengeName.textContent =
            "Challenge Not Found";


        challengeBadge.textContent =
            "ERROR";


        challengeDescription.textContent =
            "The requested challenge does not exist.";


        challengeMessage.textContent =
            "404";


        answerForm.style.display =
            "none";


        copyButton.style.display =
            "none";


    } else {


        challengeName.textContent =
            challenge.name;


        challengeBadge.textContent =
            challenge.difficulty;


        challengeDescription.textContent =
            challenge.description;


        challengeMessage.textContent =
            challenge.message;

    }



    /* ============================================
       COPY BUTTON
    ============================================ */


    copyButton.addEventListener(
        "click",
        async function() {


            if (!challenge) return;


            try {


                await navigator.clipboard.writeText(
                    challenge.message
                );


                copyButton.textContent =
                    "COPIED!";


                setTimeout(
                    function() {

                        copyButton.textContent =
                            "COPY";

                    },
                    1500
                );


            } catch (error) {


                console.error(error);


                copyButton.textContent =
                    "FAILED";


                setTimeout(
                    function() {

                        copyButton.textContent =
                            "COPY";

                    },
                    1500
                );

            }

        }
    );



    /* ============================================
       GET CURRENT USER
    ============================================ */


    async function getCurrentUser() {


        const {
            data: {
                user
            }
        } =
        await supabase.auth.getUser();


        return user;

    }



    /* ============================================
       SUBMIT ANSWER
    ============================================ */


    answerForm.addEventListener(
        "submit",
        async function(event) {


            event.preventDefault();


            if (!challenge) {
                return;
            }


            submitButton.disabled =
                true;


            result.className =
                "result";


            result.textContent =
                "Checking answer...";


            result.style.display =
                "block";



            /* USER */

            const user =
                await getCurrentUser();


            if (!user) {


                window.location.href =
                    "index.html";


                return;

            }



            /* EMPTY CHALLENGE */

            if (
                !challenge.answer ||
                challenge.answer.length === 0
            ) {


                result.className =
                    "result error";


                result.textContent =
                    "This challenge is not available yet.";


                submitButton.disabled =
                    false;


                return;

            }



            /* ANSWER */

            const userAnswer =
                answerInput.value
                    .trim()
                    .toUpperCase();



            /* ========================================
               CHECK ANSWER LOCALLY
            ======================================== */


            if (
                userAnswer !==
                challenge.answer.toUpperCase()
            ) {


                result.className =
                    "result error";


                result.textContent =
                    "Incorrect answer. Try again.";


                submitButton.disabled =
                    false;


                return;

            }



            /* ========================================
               SEND TO SUPABASE
            ======================================== */


            const {
                data,
                error
            } =
            await supabase.rpc(
                "submit_challenge_answer",
                {
                    p_challenge_id:
                        challengeId,

                    p_answer:
                        userAnswer
                }
            );



            /* ========================================
               SUPABASE ERROR
            ======================================== */


            if (error) {


                console.error(
                    "Supabase RPC error:",
                    error
                );


                result.className =
                    "result error";


                result.textContent =
                    "Correct answer, but the score could not be updated.";


                submitButton.disabled =
                    false;


                return;

            }



            /* ========================================
               RESULT
            ======================================== */


            if (
                data &&
                data.success === true
            ) {


                result.className =
                    "result success";


                result.innerHTML =
                    `
                    Correct! 🎉
                    You earned
                    <span class="points">
                        ${data.points} points
                    </span>.

                    <br>

                    Your new score:
                    <span class="points">
                        ${data.new_score}
                    </span>
                    `;


                answerInput.disabled =
                    true;


                submitButton.disabled =
                    true;


                return;

            }



            /* ========================================
               ALREADY SOLVED
            ======================================== */


            if (
                data &&
                data.already_solved === true
            ) {


                result.className =
                    "result success";


                result.textContent =
                    "You already solved this challenge.";


                answerInput.disabled =
                    true;


                submitButton.disabled =
                    true;


                return;

            }



            /* ========================================
               OTHER ERROR
            ======================================== */


            result.className =
                "result error";


            result.textContent =
                (
                    data &&
                    data.message
                )
                ?
                data.message
                :
                "Something went wrong.";


            submitButton.disabled =
                false;


        }
    );


</script>


</body>

</html>
