/* =================================================

================================================= */

async function submitAnswer() {

const answer =
answerInput.value.trim();


if (!answer) {

showMessage(
"Please enter your answer.",
"error"
);

return;

}


submitButton.disabled =
true;


submitButton.textContent =
"CHECKING...";


try {

const {
data: {
user
},
error: userError
} =
await supabase.auth.getUser();


if (
userError ||
!user
) {

showMessage(
"You must be logged in.",
"error"
);


submitButton.disabled =
false;


submitButton.textContent =
"SUBMIT ANSWER";


return;

}


const {
data,
error
} =
await supabase.rpc(
"submit_challenge_answer",
{

p_challenge_id:
challengeId,

p_answer:
answer

}
);


submitButton.disabled =
false;


submitButton.textContent =
"SUBMIT ANSWER";


if (error) {

console.error(
error
);


showMessage(
error.message ||
"Something went wrong.",
"error"
);

return;

}


if (!data) {

showMessage(
"No response received from the server.",
"error"
);

return;

}


if (
data.rate_limited
) {

const seconds =
data.seconds_remaining ||
10;


showMessage(
data.message ||
"Too many attempts. Please wait " +
seconds +
" seconds.",
"warning"
);


startCooldown(
seconds
);


return;

}


if (!data.success) {

showMessage(
data.message ||
"Incorrect answer.",
"error"
);

return;

}


showMessage(
`✓ Correct answer! You earned ${data.points} points. New score: ${data.new_score}`,
"success"
);


answerInput.disabled =
true;


submitButton.disabled =
true;


submitButton.textContent =
"SOLVED ✓";

}

catch (error) {

console.error(
error
);


submitButton.disabled =
false;


submitButton.textContent =
"SUBMIT ANSWER";


showMessage(
"Connection error. Please try again.",
"error"
);

}

}

await supabase

"challenge_id",
challengeId

!solves ||
solves.length === 0
) {

solversContent.innerHTML = `

<div class="no-solvers">

No one has solved this challenge yet.

</div>

`;

return;

}


const userIds = [

...new Set(

solves
.map(
solve =>
solve.user_id
)
.filter(Boolean)

)

];


if (
userIds.length === 0
) {

solversContent.innerHTML = `

<div class="no-solvers">

No solvers found.

</div>

`;

return;

}

data: profiles,
error: profilesError
} =
await supabase
.from("profiles")
.select(
"id, username"

userIds

throw profilesError;

}


const profileMap =
new Map();


(profiles || []).forEach(
profile => {

profileMap.set(
profile.id,
profile.username
);

}
);


let html = `

<div class="solver-count">

${userIds.length}

${
userIds.length === 1
? "player"
: "players"
}

solved this challenge.

</div>


<div class="solver-list">

`;


userIds.forEach(
function(
userId,
index
) {

const username =
profileMap.get(
userId
) ||
"Unknown user";


html += `

<div class="solver-item">

<div class="solver-number">

${index + 1}

</div>


<div class="solver-name">

${escapeHTML(
username
)}

</div>

</div>

`;

}
);


html += `

</div>

`;


solversContent.innerHTML =
html;

}

catch (error) {

console.error(
error
);


solversContent.innerHTML = `

<div class="no-solvers">

Unable to load the solvers.

<br><br>

Please try again.

</div>

`;

}

finally {

solveButton.disabled =
false;

}

}


/* =================================================
CLOSE SOLVERS
================================================= */

closeSolvers.addEventListener(
"click",
function() {

solversOverlay.classList.remove(
"active"
);

}
);


solversOverlay.addEventListener(
"click",
function(event) {

if (
event.target ===
solversOverlay
) {

solversOverlay.classList.remove(
"active"
);

}

}
);


document.addEventListener(
"keydown",
function(event) {

if (
event.key === "Escape"
) {

solversOverlay.classList.remove(
"active"
);

}

}
);


/* =================================================
COOLDOWN
================================================= */

function startCooldown(
seconds
) {

let remaining =
Math.max(
1,
Number(seconds) || 10
);


answerInput.disabled =
true;


submitButton.disabled =
true;


submitButton.textContent =
`WAIT ${remaining}s`;


const timer =
setInterval(
function() {

remaining--;


if (
remaining <= 0
) {

clearInterval(
timer
);


answerInput.disabled =
false;


submitButton.disabled =
false;


submitButton.textContent =
"SUBMIT ANSWER";


return;

}


submitButton.textContent =
`WAIT ${remaining}s`;

},
1000
);

}


/* =================================================
MESSAGE
================================================= */

function showMessage(
text,
type
) {

messageElement.textContent =
text;


messageElement.className =
"message " +
type;

}

}


/* =====================================================
ESCAPE HTML
===================================================== */

function escapeHTML(
value
) {

return String(
value ?? ""
)

.replaceAll(
"&",
"&amp;"
)

.replaceAll(
"<",
"&lt;"
)

.replaceAll(
">",
"&gt;"
)

.replaceAll(
'"',
"&quot;"
)

.replaceAll(
"'",
"&#039;"
);

}

</script>

</body>

</html>
