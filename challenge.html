<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Challenge | 0X1GHOST</title>

    <!-- FAVICON -->
    <link rel="icon" type="image/png" href="favicon.png">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #050505;
            color: white;
        }

        .navbar {
            min-height: 70px;
            border-bottom: 1px solid #222;
            background: #090909;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 12px 35px;
            gap: 20px;
        }

        .logo {
            display: flex;
            align-items: center;
        }

        .logo img {
            width: 150px;
            max-height: 55px;
            object-fit: contain;
        }

        .back {
            color: #aaa;
            text-decoration: none;
            font-weight: bold;
            font-size: 13px;
        }

        .back:hover {
            color: #00ff88;
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: auto;
            padding: 50px 25px;
        }

        .challenge {
            background: #0d0d0d;
            border: 1px solid #222;
            border-radius: 12px;
            padding: 35px;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .title {
            font-size: 30px;
        }

        .badge {
            border: 1px solid #00ff88;
            color: #00ff88;
            padding: 7px 10px;
            border-radius: 5px;
            font-size: 12px;
            font-weight: bold;
        }

        .description {
            color: #999;
            line-height: 1.7;
            margin-bottom: 25px;
        }

        .message-box {
            background: #070707;
            border: 1px solid #222;
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 25px;
        }

        .message-title {
            color: #777;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .message {
            color: #00ff88;
            font-family: monospace;
            font-size: 18px;
            word-break: break-word;
        }

        .answer-label {
            display: block;
            color: #aaa;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .answer-input {
            width: 100%;
            padding: 13px;
            background: #070707;
            border: 1px solid #333;
            border-radius: 7px;
            color: white;
            outline: none;
            font-size: 15px;
        }

        .answer-input:focus {
            border-color: #00ff88;
        }

        .submit-btn {
            margin-top: 15px;
            padding: 12px 20px;
            background: #00ff88;
            border: none;
            border-radius: 7px;
            color: #050505;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-btn:hover {
            box-shadow:
                0 0 20px rgba(0, 255, 136, 0.15);
        }

        .result {
            margin-top: 20px;
            padding: 14px;
            border-radius: 7px;
            display: none;
            line-height: 1.5;
        }

        .success {
            display: block;
            color: #00ff88;
            border: 1px solid #00ff88;
            background: rgba(0, 255, 136, 0.05);
        }

        .error {
            display: block;
            color: #ff6b6b;
            border: 1px solid #ff6b6b;
            background: rgba(255, 107, 107, 0.05);
        }

        .points {
            color: #00ff88;
            font-weight: bold;
        }

        @media (max-width: 600px) {

            .navbar {
                padding: 15px 18px;
            }

            .logo img {
                width: 125px;
            }

            .container {
                padding: 30px 18px;
            }

            .challenge {
                padding: 25px;
            }

            .top {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>

<nav class="navbar">

    <a href="dashboard.html" class="logo">
        <img src="logo.png" alt="0X1GHOST Logo">
    </a>

    <a href="challenges.html" class="back">
        ← BACK TO CHALLENGES
    </a>

</nav>


<main class="container">

    <div class="challenge">

        <div class="top">

            <h1 class="title" id="challengeName">
                Loading...
            </h1>

            <div class="badge" id="challengeBadge">
                ...
            </div>

        </div>


        <p class="description" id="challengeDescription">
            Loading challenge...
        </p>


        <div class="message-box">

            <div class="message-title">
                ENCRYPTED MESSAGE
            </div>

            <div class="message" id="challengeMessage">
                Loading...
            </div>

        </div>


        <form id="answerForm">

            <label
                class="answer-label"
                for="answer"
            >
                YOUR ANSWER
            </label>

            <input
                id="answer"
                class="answer-input"
                type="text"
                autocomplete="off"
                placeholder="Enter your answer..."
                required
            >

            <button
                class="submit-btn"
                type="submit"
            >
                SUBMIT ANSWER
            </button>

        </form>


        <div
            id="result"
            class="result"
        ></div>

    </div>

</main>


<script type="module">

    import { createClient } from
    "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


    const SUPABASE_URL =
        "https://borturaxifoxufixewya.supabase.co";


    const SUPABASE_KEY =
        "sb_publishable__lZmTM96oe10-rurqgrujg__ta_C4wr";


    const supabase =
        createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    const challenges = {

        caesar: {

            name: "Caesar's Secret",

            difficulty: "EASY · 100 PTS",

            points: 100,

            description:
                "Caesar has hidden a secret message using a classical Caesar cipher. Decode the message and submit the plaintext.",

            message:
                "FDHVDU",

            answer:
                "CAESAR"

        },


        "coming-medium": {

            name: "Coming Soon",

            difficulty: "MEDIUM · 200 PTS",

            points: 200,

            description:
                "This challenge is currently being prepared.",

            message:
                "COMING SOON",

            answer:
                ""

        },


        "coming-medium-hard": {

            name: "Coming Soon",

            difficulty: "MEDIUM HARD · 300 PTS",

            points: 300,

            description:
                "This challenge is currently being prepared.",

            message:
                "COMING SOON",

            answer:
                ""

        },


        "coming-hard": {

            name: "Coming Soon",

            difficulty: "HARD · 500 PTS",

            points: 500,

            description:
                "This challenge is currently being prepared.",

            message:
                "COMING SOON",

            answer:
                ""

        }

    };


    const params =
        new URLSearchParams(
            window.location.search
        );


    const challengeId =
        params.get("id");


    const challenge =
        challenges[challengeId];


    const challengeName =
        document.getElementById(
            "challengeName"
        );

    const challengeBadge =
        document.getElementById(
            "challengeBadge"
        );

    const challengeDescription =
        document.getElementById(
            "challengeDescription"
        );

    const challengeMessage =
        document.getElementById(
            "challengeMessage"
        );

    const answerForm =
        document.getElementById(
            "answerForm"
        );

    const answerInput =
        document.getElementById(
            "answer"
        );

    const result =
        document.getElementById(
            "result"
        );


    if (!challenge) {

        challengeName.textContent =
            "Challenge Not Found";

        challengeBadge.textContent =
            "ERROR";

        challengeDescription.textContent =
            "The requested challenge does not exist.";

        challengeMessage.textContent =
            "404";

        answerForm.style.display =
            "none";

    } else {

        challengeName.textContent =
            challenge.name;

        challengeBadge.textContent =
            challenge.difficulty;

        challengeDescription.textContent =
            challenge.description;

        challengeMessage.textContent =
            challenge.message;

    }


    async function getCurrentUser() {

        const {
            data: { user }
        } = await supabase.auth.getUser();

        return user;

    }


    answerForm.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            if (!challenge) return;


            const user =
                await getCurrentUser();


            if (!user) {

                window.location.href =
                    "index.html";

                return;

            }


            const userAnswer =
                answerInput.value
                    .trim()
                    .toUpperCase();


            if (
                !challenge.answer ||
                challenge.answer.length === 0
            ) {

                result.className =
                    "result error";

                result.textContent =
                    "This challenge is not available yet.";

                return;

            }


            if (
                userAnswer ===
                challenge.answer.toUpperCase()
            ) {

                /*
                 * Prevent repeatedly submitting
                 * the same challenge in this browser.
                 */

                const solvedKey =
                    "0x1ghost_solved_" +
                    challengeId +
                    "_" +
                    user.id;


                if (
                    localStorage.getItem(
                        solvedKey
                    )
                ) {

                    result.className =
                        "result success";

                    result.innerHTML =
                        "You already solved this challenge.";

                    return;

                }


                const {
                    data: profile,
                    error: profileError
                } = await supabase
                    .from("profiles")
                    .select("score")
                    .eq("id", user.id)
                    .maybeSingle();


                if (profileError) {

                    console.error(
                        profileError
                    );

                    result.className =
                        "result error";

                    result.textContent =
                        "Correct answer, but the score could not be updated.";

                    return;

                }


                if (!profile) {

                    result.className =
                        "result error";

                    result.textContent =
                        "Profile not found.";

                    return;

                }


                const newScore =
                    Number(profile.score || 0) +
                    Number(challenge.points);


                const {
                    error: updateError
                } = await supabase
                    .from("profiles")
                    .update({
                        score: newScore
                    })
                    .eq("id", user.id);


                if (updateError) {

                    console.error(
                        updateError
                    );

                    result.className =
                        "result error";

                    result.textContent =
                        "Correct answer, but the score could not be updated.";

                    return;

                }


                localStorage.setItem(
                    solvedKey,
                    "true"
                );


                result.className =
                    "result success";

                result.innerHTML =
                    `
                    Correct! 🎉
                    You earned
                    <span class="points">
                        ${challenge.points} points
                    </span>.
                    `;


                answerInput.disabled =
                    true;

                document.querySelector(
                    ".submit-btn"
                ).disabled = true;

            } else {

                result.className =
                    "result error";

                result.textContent =
                    "Incorrect answer. Try again.";

            }

        }
    );

</script>

</body>
</html>
