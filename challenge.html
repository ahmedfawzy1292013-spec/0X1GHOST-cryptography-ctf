<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Challenge | 0X1GHOST</title>

    <link
        rel="icon"
        type="image/png"
        href="favicon.png"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #050505;
            color: white;
        }

        .navbar {
            min-height: 70px;

            border-bottom:
                1px solid #222;

            background: #090909;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 12px 35px;

            gap: 20px;
        }

        .logo img {
            display: block;

            width: 150px;

            max-height: 55px;

            object-fit: contain;
        }

        .back-btn {
            color: #aaa;

            text-decoration: none;

            font-size: 13px;

            font-weight: bold;
        }

        .back-btn:hover {
            color: #00ff88;
        }

        .container {
            width: 100%;

            max-width: 900px;

            margin: auto;

            padding: 50px 25px;
        }

        .challenge-box {
            position: relative;

            background: #0d0d0d;

            border: 1px solid #222;

            border-radius: 12px;

            padding: 30px;
        }

        .challenge-type {
            color: #00ff88;

            font-size: 12px;

            font-weight: bold;

            letter-spacing: 1px;

            margin-bottom: 12px;

            padding-right: 100px;
        }

        .challenge-title {
            font-size: 32px;

            margin-bottom: 18px;

            padding-right: 100px;
        }

        .challenge-description {
            color: #888;

            line-height: 1.7;

            white-space: pre-line;

            margin-bottom: 35px;
        }

        .encrypted-header {
            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

            margin-bottom: 12px;
        }

        .section-title {
            color: white;

            font-size: 15px;

            font-weight: bold;
        }

        .encrypted-message {
            background: #070707;

            border: 1px solid #222;

            border-radius: 8px;

            padding: 18px;

            color: #00ff88;

            font-family:
                "Courier New",
                monospace;

            font-size: 14px;

            line-height: 1.7;

            white-space: pre-wrap;

            word-break: break-word;

            overflow-x: auto;

            margin-bottom: 30px;
        }

        .copy-btn {
            background: #101010;

            border: 1px solid #333;

            color: #aaa;

            border-radius: 6px;

            padding: 7px 12px;

            font-size: 11px;

            font-weight: bold;

            cursor: pointer;
        }

        .copy-btn:hover {
            border-color: #00ff88;

            color: #00ff88;
        }

        .copy-btn.copied {
            color: #00ff88;

            border-color: #00ff88;
        }

        .hint-box {
            margin-top: 12px;

            margin-bottom: 30px;

            background:
                rgba(255, 209, 102, 0.05);

            border:
                1px solid
                rgba(255, 209, 102, 0.25);

            color: #ffd166;

            border-radius: 8px;

            padding: 15px;

            line-height: 1.6;

            font-size: 14px;

            white-space: pre-line;
        }

        .answer-label {
            display: block;

            color: #aaa;

            font-size: 12px;

            font-weight: bold;

            margin-bottom: 8px;
        }

        .answer-input {
            width: 100%;

            background: #070707;

            border: 1px solid #292929;

            color: white;

            border-radius: 7px;

            padding: 13px;

            outline: none;

            font-family:
                "Courier New",
                monospace;

            margin-bottom: 12px;
        }

        .answer-input:focus {
            border-color: #00ff88;

            box-shadow:
                0 0 15px
                rgba(0, 255, 136, 0.06);
        }

        .submit-btn {
            width: 100%;

            background: #00ff88;

            color: #050505;

            border: none;

            border-radius: 7px;

            padding: 13px;

            font-size: 12px;

            font-weight: bold;

            cursor: pointer;
        }

        .submit-btn:hover {
            opacity: 0.9;
        }

        .submit-btn:disabled {
            cursor: not-allowed;

            opacity: 0.5;
        }

        .solve-btn {
            position: absolute;

            top: 25px;

            right: 25px;

            background: transparent;

            border: 1px solid #333;

            color: #aaa;

            border-radius: 6px;

            padding: 8px 13px;

            font-size: 11px;

            font-weight: bold;

            cursor: pointer;
        }

        .solve-btn:hover {
            color: #00ff88;

            border-color: #00ff88;
        }

        .message {
            margin-top: 15px;

            padding: 13px;

            border-radius: 7px;

            font-size: 13px;

            line-height: 1.5;

            display: none;
        }

        .message.success {
            display: block;

            color: #00ff88;

            background:
                rgba(0, 255, 136, 0.07);

            border:
                1px solid
                rgba(0, 255, 136, 0.25);
        }

        .message.error {
            display: block;

            color: #ff6b6b;

            background:
                rgba(255, 107, 107, 0.07);

            border:
                1px solid
                rgba(255, 107, 107, 0.25);
        }

        .message.warning {
            display: block;

            color: #ffd166;

            background:
                rgba(255, 209, 102, 0.07);

            border:
                1px solid
                rgba(255, 209, 102, 0.25);
        }

        .not-found {
            text-align: center;

            padding: 60px 20px;

            background: #0d0d0d;

            border: 1px solid #222;

            border-radius: 12px;
        }

        .not-found h1 {
            margin-bottom: 15px;
        }

        .not-found p {
            color: #777;

            margin-bottom: 25px;
        }

        .solvers-overlay {
            position: fixed;

            inset: 0;

            background:
                rgba(0, 0, 0, 0.78);

            display: none;

            align-items: center;

            justify-content: center;

            padding: 20px;

            z-index: 9999;
        }

        .solvers-overlay.active {
            display: flex;
        }

        .solvers-modal {
            width: 100%;

            max-width: 500px;

            max-height: 80vh;

            overflow: hidden;

            background: #0d0d0d;

            border: 1px solid #292929;

            border-radius: 12px;

            box-shadow:
                0 0 40px
                rgba(0, 255, 136, 0.08);
        }

        .solvers-header {
            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 20px;

            border-bottom: 1px solid #222;
        }

        .solvers-header h2 {
            color: #00ff88;

            font-size: 18px;
        }

        .close-solvers {
            background: transparent;

            border: none;

            color: #777;

            font-size: 25px;

            cursor: pointer;

            line-height: 1;
        }

        .close-solvers:hover {
            color: #00ff88;
        }

        .solvers-content {
            padding: 20px;

            max-height: 60vh;

            overflow-y: auto;
        }

        .solver-count {
            color: #777;

            font-size: 13px;

            margin-bottom: 15px;
        }

        .solver-list {
            display: flex;

            flex-direction: column;

            gap: 10px;
        }

        .solver-item {
            display: flex;

            align-items: center;

            gap: 12px;

            background: #080808;

            border: 1px solid #222;

            border-radius: 7px;

            padding: 12px 14px;
        }

        .solver-number {
            width: 28px;

            height: 28px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 50%;

            background: #101010;

            border: 1px solid #333;

            color: #00ff88;

            font-size: 12px;

            font-weight: bold;

            flex-shrink: 0;
        }

        .solver-name {
            color: white;

            font-size: 14px;

            word-break: break-word;
        }

        .no-solvers {
            text-align: center;

            color: #777;

            padding: 30px 10px;

            line-height: 1.6;
        }

        .loading-solvers {
            text-align: center;

            color: #00ff88;

            padding: 30px 10px;
        }

        @media (max-width: 600px) {

            .navbar {
                padding: 15px 18px;
            }

            .container {
                padding: 30px 18px;
            }

            .challenge-box {
                padding: 22px;
            }

            .challenge-title {
                font-size: 26px;
            }

            .logo img {
                width: 125px;
            }

            .encrypted-header {
                align-items: flex-start;
            }

            .solve-btn {
                top: 18px;

                right: 18px;

                padding: 7px 12px;
            }

            .challenge-type,
            .challenge-title {
                padding-right: 85px;
            }

            .solvers-modal {
                max-height: 85vh;
            }

        }

    </style>

</head>

const hints = {

/* =========================================
   GET SLUG
   ========================================= */

const params =
    new URLSearchParams(
        window.location.search
    );


const challengeSlug =
    params.get("id");


/* =========================================
   VALIDATE SLUG
   ========================================= */

if (!challengeSlug) {

    showNotFound();

}
else {

    loadChallenge();

}


/* =========================================
   LOAD CHALLENGE FROM DATABASE
   ========================================= */

async function loadChallenge() {

    const {
        data: challenge,
        error
    } =
    await supabase
        .from("challenges")
        .select(
            "id, title, description, category, difficulty, points, slug"
        )
        .eq(
            "slug",
            challengeSlug
        )
        .maybeSingle();


    if (error) {

        console.error(error);

        challengeContainer.innerHTML = `

            <div class="not-found">

                <h1>
                    Database Error
                </h1>

                <p>
                    ${escapeHTML(
                        error.message
                    )}
                </p>

                <a
                    href="challenges.html"
                    class="back-btn"
                >
                    ← BACK TO CHALLENGES
                </a>

            </div>

        `;

        return;

    }


    if (!challenge) {

        showNotFound();

        return;

    }


    renderChallenge(
        challenge
    );

}


/* =========================================
   RENDER
   ========================================= */

function renderChallenge(challenge) {

    document.title =
        challenge.title +
        " | 0X1GHOST";


    const encrypted =
        encryptedMessages[
            challenge.slug
        ] ||
        "Encrypted message unavailable.";


    const hint =
        hints[
            challenge.slug
        ] ||
        "";


    challengeContainer.innerHTML = `

        <div class="challenge-box">


            <button
                id="solveButton"
                class="solve-btn"
                type="button"
            >
                SOLVE
            </button>


            <div class="challenge-type">

                ${escapeHTML(
                    challenge.category ||
                    challenge.difficulty ||
                    "CHALLENGE"
                )}

            </div>


            <h1 class="challenge-title">

                ${escapeHTML(
                    challenge.title
                )}

            </h1>


            <p class="challenge-description">

                ${escapeHTML(
                    challenge.description ||
                    ""
                )}

            </p>


            <div class="encrypted-header">

                <div class="section-title">
                    ENCRYPTED MESSAGE
                </div>


                <button
                    id="copyButton"
                    class="copy-btn"
                    type="button"
                >
                    COPY
                </button>

            </div>


            <div
                id="encryptedMessage"
                class="encrypted-message"
            >${escapeHTML(
                encrypted
            )}</div>


            ${
                hint
                ?
                `

                    <div class="section-title">
                        HINT
                    </div>


                    <div class="hint-box">

                        ${escapeHTML(
                            hint
                        )}

                    </div>

                `
                :
                ""
            }


            <label
                class="answer-label"
                for="answer"
            >
                SUBMIT FLAG
            </label>


            <input
                id="answer"
                class="answer-input"
                type="text"
                placeholder="0X1GHOST{...}"
                autocomplete="off"
                spellcheck="false"
            >


            <button
                id="submitButton"
                class="submit-btn"
                type="button"
            >
                SUBMIT ANSWER
            </button>


            <div
                id="message"
                class="message"
            ></div>


        </div>

    `;


    setupEvents(
        challenge
    );

}


/* =========================================
   SETUP EVENTS
   ========================================= */

function setupEvents(challenge) {

    const answerInput =
        document.getElementById(
            "answer"
        );


    const submitButton =
        document.getElementById(
            "submitButton"
        );


    const messageElement =
        document.getElementById(
            "message"
        );


    const copyButton =
        document.getElementById(
            "copyButton"
        );


    const solveButton =
        document.getElementById(
            "solveButton"
        );


    /* =====================================
       COPY
       ===================================== */

    copyButton.addEventListener(
        "click",
        async function() {

            try {

                await navigator.clipboard.writeText(
                    encryptedMessages[
                        challenge.slug
                    ] || ""
                );


                copyButton.textContent =
                    "COPIED! ✓";


                copyButton.classList.add(
                    "copied"
                );


                setTimeout(
                    function() {

                        copyButton.textContent =
                            "COPY";


                        copyButton.classList.remove(
                            "copied"
                        );

                    },
                    2000
                );

            }

            catch (error) {

                console.error(error);

                copyButton.textContent =
                    "FAILED";


                setTimeout(
                    function() {

                        copyButton.textContent =
                            "COPY";

                    },
                    2000
                );

            }

        }
    );


    /* =====================================
       SOLVE BUTTON
       ===================================== */

    solveButton.addEventListener(
        "click",
        showSolvers
    );


    /* =====================================
       SUBMIT
       ===================================== */

    submitButton.addEventListener(
        "click",
        submitAnswer
    );


    answerInput.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                submitAnswer();

            }

        }
    );


    /* =====================================
       SUBMIT ANSWER
       ===================================== */

    async function submitAnswer() {

        const answer =
            answerInput.value.trim();


        if (!answer) {

            showMessage(
                "Please enter your answer.",
                "error"
            );

            return;

        }


        submitButton.disabled =
            true;


        submitButton.textContent =
            "CHECKING...";


        try {

            const {
                data: {
                    user
                },
                error: userError
            } =
            await supabase.auth.getUser();


            if (
                userError ||
                !user
            ) {

                showMessage(
                    "You must be logged in.",
                    "error"
                );


                submitButton.disabled =
                    false;


                submitButton.textContent =
                    "SUBMIT ANSWER";


                return;

            }


            const {
                data,
                error
            } =
            await supabase.rpc(
                "submit_challenge_answer",
                {
                    p_challenge_id:
                        challenge.slug,

                    p_answer:
                        answer
                }
            );


            if (error) {

                console.error(error);


                showMessage(
                    error.message ||
                    "Something went wrong.",
                    "error"
                );


                submitButton.disabled =
                    false;


                submitButton.textContent =
                    "SUBMIT ANSWER";


                return;

            }


            if (!data) {

                showMessage(
                    "No response received from the server.",
                    "error"
                );


                submitButton.disabled =
                    false;


                submitButton.textContent =
                    "SUBMIT ANSWER";


                return;

            }


            if (
                data.rate_limited
            ) {

                const seconds =
                    data.seconds_remaining ||
                    10;


                showMessage(
                    data.message ||
                    "Too many attempts. Please wait " +
                    seconds +
                    " seconds.",
                    "warning"
                );


                startCooldown(
                    seconds
                );


                return;

            }


            if (!data.success) {

                showMessage(
                    data.message ||
                    "Incorrect answer.",
                    "error"
                );


                submitButton.disabled =
                    false;


                submitButton.textContent =
                    "SUBMIT ANSWER";


                return;

            }


            showMessage(
                `✓ Correct answer! You earned ${data.points} points. New score: ${data.new_score}`,
                "success"
            );


            answerInput.disabled =
                true;


            submitButton.disabled =
                true;


            submitButton.textContent =
                "SOLVED ✓";

        }

        catch (error) {

            console.error(error);


            submitButton.disabled =
                false;


            submitButton.textContent =
                "SUBMIT ANSWER";


            showMessage(
                "Connection error. Please try again.",
                "error"
            );

        }

    }


    /* =====================================
       SOLVERS
       ===================================== */

    async function showSolvers() {

        solversOverlay.classList.add(
            "active"
        );


        solversContent.innerHTML = `

            <div class="loading-solvers">
                Loading...
            </div>

        `;


        solveButton.disabled =
            true;


        try {

            const {
                data: solves,
                error: solvesError
            } =
            await supabase
                .from("challenge_solves")
                .select("user_id")
                .eq(
                    "challenge_id",
                    challenge.slug
                );


            if (solvesError) {

                throw solvesError;

            }


            if (
                !solves ||
                solves.length === 0
            ) {

                solversContent.innerHTML = `

                    <div class="no-solvers">

                        No one has solved this challenge yet.

                    </div>

                `;

                return;

            }


            const userIds = [
                ...new Set(
                    solves
                        .map(
                            solve =>
                                solve.user_id
                        )
                        .filter(Boolean)
                )
            ];


            if (
                userIds.length === 0
            ) {

                solversContent.innerHTML = `

                    <div class="no-solvers">
                        No solvers found.
                    </div>

                `;

                return;

            }


            const {
                data: profiles,
                error: profilesError
            } =
            await supabase
                .from("profiles")
                .select(
                    "id, username"
                )
                .in(
                    "id",
                    userIds
                );


            if (profilesError) {

                throw profilesError;

            }


            const profileMap =
                new Map();


            (profiles || []).forEach(
                profile => {

                    profileMap.set(
                        profile.id,
                        profile.username
                    );

                }
            );


            let html = `

                <div class="solver-count">

                    ${userIds.length}

                    ${
                        userIds.length === 1
                        ? "player"
                        : "players"
                    }

                    solved this challenge.

                </div>


                <div class="solver-list">

            `;


            userIds.forEach(
                function(
                    userId,
                    index
                ) {

                    const username =
                        profileMap.get(
                            userId
                        ) ||
                        "Unknown user";


                    html += `

                        <div class="solver-item">

                            <div class="solver-number">

                                ${index + 1}

                            </div>


                            <div class="solver-name">

                                ${escapeHTML(
                                    username
                                )}

                            </div>

                        </div>

                    `;

                }
            );


            html += `
                </div>
            `;


            solversContent.innerHTML =
                html;

        }

        catch (error) {

            console.error(error);


            solversContent.innerHTML = `

                <div class="no-solvers">

                    Unable to load the solvers.

                    <br>

                    Please try again.

                </div>

            `;

        }

        finally {

            solveButton.disabled =
                false;

        }

    }


    /* =====================================
       CLOSE SOLVERS
       ===================================== */

    closeSolvers.addEventListener(
        "click",
        function() {

            solversOverlay.classList.remove(
                "active"
            );

        }
    );


    solversOverlay.addEventListener(
        "click",
        function(event) {

            if (
                event.target ===
                solversOverlay
            ) {

                solversOverlay.classList.remove(
                    "active"
                );

            }

        }
    );


    document.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Escape"
            ) {

                solversOverlay.classList.remove(
                    "active"
                );

            }

        }
    );


    /* =====================================
       COOLDOWN
       ===================================== */

    function startCooldown(seconds) {

        let remaining =
            Math.max(
                1,
                Number(seconds) || 10
            );


        answerInput.disabled =
            true;


        submitButton.disabled =
            true;


        submitButton.textContent =
            `WAIT ${remaining}s`;


        const timer =
            setInterval(
                function() {

                    remaining--;


                    if (
                        remaining <= 0
                    ) {

                        clearInterval(
                            timer
                        );


                        answerInput.disabled =
                            false;


                        submitButton.disabled =
                            false;


                        submitButton.textContent =
                            "SUBMIT ANSWER";


                        return;

                    }


                    submitButton.textContent =
                        `WAIT ${remaining}s`;

                },
                1000
            );

    }


    /* =====================================
       MESSAGE
       ===================================== */

    function showMessage(
        text,
        type
    ) {

        messageElement.textContent =
            text;


        messageElement.className =
            "message " +
            type;

    }

}


/* =========================================
   NOT FOUND
   ========================================= */

function showNotFound() {

    challengeContainer.innerHTML = `

        <div class="not-found">

            <h1>
                Challenge Not Found
            </h1>

            <p>
                The requested challenge does not exist.
            </p>

            <a
                href="challenges.html"
                class="back-btn"
            >
                ← BACK TO CHALLENGES
            </a>

        </div>

    `;

}


/* =========================================
   ESCAPE HTML
   ========================================= */

function escapeHTML(value) {

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}

</script>
