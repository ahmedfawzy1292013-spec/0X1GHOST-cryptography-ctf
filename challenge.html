
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Challenge | 0X1GHOST</title>

    <link rel="icon" type="image/png" href="favicon.png">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #050505;
            color: white;
        }

        .navbar {
            min-height: 70px;
            border-bottom: 1px solid #222;
            background: #090909;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 12px 35px;
            gap: 20px;
        }

        .logo img {
            width: 150px;
            max-height: 55px;
            object-fit: contain;
        }

        .back {
            color: #aaa;
            text-decoration: none;
            font-weight: bold;
            font-size: 13px;
        }

        .back:hover {
            color: #00ff88;
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: auto;
            padding: 50px 25px;
        }

        .challenge {
            background: #0d0d0d;
            border: 1px solid #222;
            border-radius: 12px;
            padding: 35px;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .title {
            font-size: 30px;
        }

        .badge {
            border: 1px solid #00ff88;
            color: #00ff88;
            padding: 7px 10px;
            border-radius: 5px;
            font-size: 12px;
            font-weight: bold;
        }

        .description {
            color: #999;
            line-height: 1.7;
            margin-bottom: 25px;
        }

        .message-box {
            background: #070707;
            border: 1px solid #222;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 25px;
        }

        .message-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #777;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 12px;
            gap: 10px;
        }

        .message-wrapper {
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .message {
            color: #00ff88;
            font-family: monospace;
            font-size: 17px;
            line-height: 1.7;
            word-break: break-all;
            flex: 1;
        }

        .copy-btn {
            flex-shrink: 0;
            background: #111;
            border: 1px solid #333;
            color: #aaa;
            padding: 7px 11px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
        }

        .copy-btn:hover {
            color: #00ff88;
            border-color: #00ff88;
        }

        .answer-label {
            display: block;
            color: #aaa;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .answer-input {
            width: 100%;
            padding: 13px;
            background: #070707;
            border: 1px solid #333;
            border-radius: 7px;
            color: white;
            outline: none;
            font-size: 15px;
        }

        .answer-input:focus {
            border-color: #00ff88;
        }

        .submit-btn {
            margin-top: 15px;
            padding: 12px 20px;
            background: #00ff88;
            border: none;
            border-radius: 7px;
            color: #050505;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .result {
            margin-top: 20px;
            padding: 14px;
            border-radius: 7px;
            display: none;
            line-height: 1.5;
        }

        .success {
            display: block;
            color: #00ff88;
            border: 1px solid #00ff88;
            background: rgba(0, 255, 136, 0.05);
        }

        .error {
            display: block;
            color: #ff6b6b;
            border: 1px solid #ff6b6b;
            background: rgba(255, 107, 107, 0.05);
        }

        .points {
            color: #00ff88;
            font-weight: bold;
        }

        @media (max-width: 600px) {

            .navbar {
                padding: 15px 18px;
            }

            .logo img {
                width: 125px;
            }

            .container {
                padding: 30px 18px;
            }

            .challenge {
                padding: 25px;
            }

            .top {
                flex-direction: column;
                align-items: flex-start;
            }

            .message-wrapper {
                flex-direction: column;
            }

            .copy-btn {
                align-self: flex-start;
            }
        }
    </style>
</head>

<body>

<nav class="navbar">

    <a href="dashboard.html" class="logo">
        <img src="logo.png" alt="0X1GHOST Logo">
    </a>

    <a href="challenges.html" class="back">
        ← BACK TO CHALLENGES
    </a>

</nav>

<main class="container">

    <div class="challenge">

        <div class="top">

            <h1 class="title" id="challengeName">
                Loading...
            </h1>

            <div class="badge" id="challengeBadge">
                ...
            </div>

        </div>

        <p class="description" id="challengeDescription">
            Loading challenge...
        </p>

        <div class="message-box">

            <div class="message-title">

                <span>
                    ENCRYPTED MESSAGE
                </span>

            </div>

            <div class="message-wrapper">

                <div class="message" id="challengeMessage">
                    Loading...
                </div>

                <button
                    type="button"
                    class="copy-btn"
                    id="copyButton"
                >
                    COPY
                </button>

            </div>

        </div>

        <form id="answerForm">

            <label
                class="answer-label"
                for="answer"
            >
                YOUR ANSWER
            </label>

            <input
                id="answer"
                class="answer-input"
                type="text"
                autocomplete="off"
                placeholder="Enter the flag..."
                required
            >

            <button
                class="submit-btn"
                type="submit"
            >
                SUBMIT ANSWER
            </button>

        </form>

        <div
            id="result"
            class="result"
        ></div>

    </div>

</main>

<script type="module">

import { createClient } from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const SUPABASE_URL =
    "https://borturaxifoxufixewya.supabase.co";

const SUPABASE_KEY =
    "sb_publishable__lZmTM96oe10-rurqgrujg__ta_C4wr";

const supabase =
    createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const challenges = {

    caesar: {

        name: "Caesar's Secret",

        difficulty: "EASY · 100 PTS",

        points: 100,

        description:
            "Caesar has hidden a secret message using a classical Caesar cipher. Decode the message and submit the plaintext.",

        message:
            "FDHVDU"

    },


    rot13: {

        name: "What Type This ROT",

        difficulty: "EASY · 100 PTS",

        points: 100,

        description:
            "Identify the ROT cipher used to transform the ciphertext, decode it, and submit the flag.",

        message:
            "0K1TUBFG{V_N9521_C02E90E3Eq_103_fqns}"

    },


    binary: {

        name: "Binary Secret",

        difficulty: "EASY · 100 PTS",

        points: 100,

        description:
            "The secret message has been represented using binary. Convert the binary bytes into text and submit the hidden flag.",

        message:
            "00110000 01011000 00110001 01000111 01001000 01001111 01010011 01010100 01111011 01100111 00110000 00110000 01100100 01011111 01101010 00110000 00110100 01011111 01110100 01101000 00110011 00110110 01011111 01100001 00110011 00110111 00110010 01111101"

    },


    "coming-medium": {

        name: "Coming Soon",

        difficulty: "MEDIUM · 200 PTS",

        points: 200,

        description:
            "This challenge is currently being prepared.",

        message:
            "COMING SOON"

    },


    "coming-medium-hard": {

        name: "Coming Soon",

        difficulty: "MEDIUM HARD · 300 PTS",

        points: 300,

        description:
            "This challenge is currently being prepared.",

        message:
            "COMING SOON"

    },


    "coming-hard": {

        name: "Coming Soon",

        difficulty: "HARD · 500 PTS",

        points: 500,

        description:
            "This challenge is currently being prepared.",

        message:
            "COMING SOON"

    }

};


const params =
    new URLSearchParams(
        window.location.search
    );

const challengeId =
    params.get("id");

const challenge =
    challenges[challengeId];


const challengeName =
    document.getElementById(
        "challengeName"
    );

const challengeBadge =
    document.getElementById(
        "challengeBadge"
    );

const challengeDescription =
    document.getElementById(
        "challengeDescription"
    );

const challengeMessage =
    document.getElementById(
        "challengeMessage"
    );

const answerForm =
    document.getElementById(
        "answerForm"
    );

const answerInput =
    document.getElementById(
        "answer"
    );

const result =
    document.getElementById(
        "result"
    );

const copyButton =
    document.getElementById(
        "copyButton"
    );


if (!challenge) {

    challengeName.textContent =
        "Challenge Not Found";

    challengeBadge.textContent =
        "ERROR";

    challengeDescription.textContent =
        "The requested challenge does not exist.";

    challengeMessage.textContent =
        "404";

    answerForm.style.display =
        "none";

    copyButton.style.display =
        "none";

} else {

    challengeName.textContent =
        challenge.name;

    challengeBadge.textContent =
        challenge.difficulty;

    challengeDescription.textContent =
        challenge.description;

    challengeMessage.textContent =
        challenge.message;

}


/* COPY CIPHERTEXT */

copyButton.addEventListener(
    "click",
    async function() {

        if (!challenge) return;

        try {

            await navigator.clipboard.writeText(
                challenge.message
            );

            copyButton.textContent =
                "COPIED!";

            setTimeout(
                function() {
                    copyButton.textContent =
                        "COPY";
                },
                1500
            );

        } catch (error) {

            console.error(error);

            copyButton.textContent =
                "FAILED";

            setTimeout(
                function() {
                    copyButton.textContent =
                        "COPY";
                },
                1500
            );

        }

    }
);


/* GET CURRENT USER */

async function getCurrentUser() {

    const {
        data: { user }
    } = await supabase.auth.getUser();

    return user;

}


/* SUBMIT */

answerForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        if (!challenge) return;


        const user =
            await getCurrentUser();


        if (!user) {

            window.location.href =
                "index.html";

            return;

        }


        const userAnswer =
            answerInput.value.trim();


        if (!userAnswer) {

            return;

        }


        result.className =
            "result";

        result.textContent =
            "Checking answer...";


        const {
            data,
            error
        } = await supabase.rpc(
            "submit_challenge_answer",
            {
                p_challenge_id:
                    challengeId,

                p_answer:
                    userAnswer
            }
        );


        if (error) {

            console.error(error);

            result.className =
                "result error";

            result.textContent =
                "Could not submit the answer. Please try again.";

            return;

        }


        if (!data) {

            result.className =
                "result error";

            result.textContent =
                "No response from server.";

            return;

        }


        if (data.success) {

            result.className =
                "result success";

            result.innerHTML =
                `
                Correct! 🎉
                You earned
                <span class="points">
                    ${data.points} points
                </span>.
                `;

            answerInput.disabled =
                true;

            document.querySelector(
                ".submit-btn"
            ).disabled = true;

        } else if (data.already_solved) {

            result.className =
                "result success";

            result.textContent =
                "You already solved this challenge.";

        } else {

            result.className =
                "result error";

            result.textContent =
                data.message ||
                "Incorrect answer. Try again.";

        }

    }
);

</script>

</body>
</html>
