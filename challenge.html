<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Challenge | 0X1GHOST</title>

    <link
        rel="icon"
        type="image/png"
        href="favicon.png"
    >


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }


        body {
            min-height: 100vh;

            background: #050505;

            color: white;
        }


        .navbar {
            min-height: 70px;

            border-bottom:
                1px solid #222;

            background: #090909;

            display: flex;

            align-items: center;

            justify-content:
                space-between;

            padding:
                12px 35px;

            gap: 20px;
        }


        .logo {
            display: flex;

            align-items: center;
        }


        .logo img {
            display: block;

            width: 150px;

            max-height: 55px;

            object-fit: contain;
        }


        .back-btn {
            text-decoration: none;

            color: #aaa;

            border:
                1px solid #333;

            padding:
                9px 15px;

            border-radius: 6px;

            transition: 0.2s;
        }


        .back-btn:hover {
            color: #00ff88;

            border-color:
                #00ff88;
        }


        .container {
            width: 100%;

            max-width: 950px;

            margin: auto;

            padding:
                50px 25px;
        }


        .challenge-box {
            position: relative;

            background: #0d0d0d;

            border:
                1px solid #222;

            border-radius: 12px;

            padding: 35px;
        }


        .challenge-type {
            color: #00ff88;

            font-size: 12px;

            font-weight: bold;

            letter-spacing: 2px;

            margin-bottom: 15px;

            padding-right: 100px;
        }


        .challenge-title {
            font-size: 32px;

            margin-bottom: 15px;

            padding-right: 100px;
        }


        .challenge-description {
            color: #999;

            line-height: 1.7;

            margin-bottom: 30px;

            white-space: pre-line;
        }


        .section-title {
            font-size: 14px;

            color: #777;

            margin-bottom: 12px;

            font-weight: bold;
        }


        .solve-btn {
            position: absolute;

            top: 22px;

            right: 22px;

            background:
                transparent;

            color: #00ff88;

            border:
                1px solid #00ff88;

            padding:
                8px 15px;

            border-radius: 6px;

            font-size: 12px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;

            z-index: 5;
        }


        .solve-btn:hover {
            background: #00ff88;

            color: #050505;

            transform:
                translateY(-1px);
        }


        .solve-btn:disabled {
            opacity: 0.6;

            cursor:
                not-allowed;
        }


        .encrypted-header {
            display: flex;

            align-items: center;

            justify-content:
                space-between;

            gap: 15px;

            margin-bottom: 12px;
        }


        .encrypted-header
        .section-title {
            margin-bottom: 0;
        }


        .copy-btn {
            background:
                transparent;

            color: #00ff88;

            border:
                1px solid #00ff88;

            padding:
                8px 14px;

            border-radius: 6px;

            font-size: 12px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }


        .copy-btn:hover {
            background: #00ff88;

            color: #050505;
        }


        .copy-btn.copied {
            background: #00ff88;

            color: #050505;
        }


        .encrypted-message {
            width: 100%;

            background: #070707;

            border:
                1px solid #292929;

            border-radius: 8px;

            padding: 20px;

            color: #00ff88;

            font-family: monospace;

            font-size: 14px;

            line-height: 1.7;

            word-break: break-all;

            white-space: pre-wrap;

            margin-bottom: 30px;

            max-height: 350px;

            overflow-y: auto;
        }


        .hint-box {
            background: #101010;

            border:
                1px solid #333;

            border-left:
                3px solid #00ff88;

            padding: 18px;

            border-radius: 7px;

            color: #aaa;

            line-height: 1.7;

            margin-bottom: 30px;

            white-space: pre-line;
        }


        .answer-label {
            display: block;

            color: #777;

            font-size: 13px;

            font-weight: bold;

            margin-bottom: 10px;
        }


        .answer-input {
            width: 100%;

            background: #070707;

            border:
                1px solid #333;

            border-radius: 7px;

            padding: 15px;

            color: white;

            font-family: monospace;

            font-size: 15px;

            outline: none;

            margin-bottom: 15px;
        }


        .answer-input:focus {
            border-color:
                #00ff88;
        }


        .submit-btn {
            background: #00ff88;

            color: #050505;

            border: none;

            padding:
                13px 24px;

            border-radius: 7px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }


        .submit-btn:hover:not(:disabled) {
            transform:
                translateY(-2px);

            box-shadow:
                0 0 25px
                rgba(
                    0,
                    255,
                    136,
                    0.2
                );
        }


        .submit-btn:disabled {
            opacity: 0.6;

            cursor:
                not-allowed;
        }


        .message {
            display: none;

            margin-top: 20px;

            padding: 15px;

            border-radius: 7px;

            line-height: 1.6;
        }


        .message.success {
            display: block;

            background:
                rgba(
                    0,
                    255,
                    136,
                    0.08
                );

            border:
                1px solid #00ff88;

            color: #00ff88;
        }


        .message.error {
            display: block;

            background:
                rgba(
                    255,
                    107,
                    107,
                    0.08
                );

            border:
                1px solid #ff6b6b;

            color: #ff6b6b;
        }


        .message.warning {
            display: block;

            background:
                rgba(
                    255,
                    209,
                    102,
                    0.08
                );

            border:
                1px solid #ffd166;

            color: #ffd166;
        }


        .solvers-overlay {
            display: none;

            position: fixed;

            inset: 0;

            background:
                rgba(
                    0,
                    0,
                    0,
                    0.75
                );

            z-index: 1000;

            align-items: center;

            justify-content: center;

            padding: 20px;
        }


        .solvers-overlay.active {
            display: flex;
        }


        .solvers-modal {
            width: 100%;

            max-width: 500px;

            max-height: 80vh;

            overflow: hidden;

            background: #0d0d0d;

            border:
                1px solid #292929;

            border-radius: 12px;

            box-shadow:
                0 0 40px
                rgba(
                    0,
                    255,
                    136,
                    0.08
                );
        }


        .solvers-header {
            display: flex;

            align-items: center;

            justify-content:
                space-between;

            padding: 20px;

            border-bottom:
                1px solid #222;
        }


        .solvers-header h2 {
            color: #00ff88;

            font-size: 18px;
        }


        .close-solvers {
            background:
                transparent;

            border: none;

            color: #777;

            font-size: 25px;

            cursor: pointer;

            line-height: 1;
        }


        .close-solvers:hover {
            color: #00ff88;
        }


        .solvers-content {
            padding: 20px;

            max-height: 60vh;

            overflow-y: auto;
        }


        .solver-count {
            color: #777;

            font-size: 13px;

            margin-bottom: 15px;
        }


        .solver-list {
            display: flex;

            flex-direction: column;

            gap: 10px;
        }


        .solver-item {
            display: flex;

            align-items: center;

            gap: 12px;

            background: #080808;

            border:
                1px solid #222;

            border-radius: 7px;

            padding:
                12px 14px;
        }


        .solver-number {
            width: 28px;

            height: 28px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 50%;

            background: #101010;

            border:
                1px solid #333;

            color: #00ff88;

            font-size: 12px;

            font-weight: bold;

            flex-shrink: 0;
        }


        .solver-name {
            color: white;

            font-size: 14px;

            word-break: break-word;
        }


        .no-solvers {
            text-align: center;

            color: #777;

            padding:
                30px 10px;

            line-height: 1.6;
        }


        .loading-solvers {
            text-align: center;

            color: #00ff88;

            padding:
                30px 10px;
        }


        .not-found {
            text-align: center;

            padding:
                60px 20px;

            background: #0d0d0d;

            border:
                1px solid #222;

            border-radius: 12px;
        }


        .not-found h1 {
            margin-bottom: 15px;
        }


        .not-found p {
            color: #777;

            margin-bottom: 25px;
        }


        @media (max-width: 600px) {

            .navbar {
                padding:
                    15px 18px;
            }


            .container {
                padding:
                    30px 18px;
            }


            .challenge-box {
                padding: 22px;
            }


            .challenge-title {
                font-size: 26px;
            }


            .logo img {
                width: 125px;
            }


            .encrypted-header {
                align-items:
                    flex-start;
            }


            .solve-btn {
                top: 18px;

                right: 18px;

                padding:
                    7px 12px;
            }


            .challenge-type,
            .challenge-title {
                padding-right: 85px;
            }


            .solvers-modal {
                max-height: 85vh;
            }

        }

    </style>

</head>


<body>


<nav class="navbar">


    <a
        href="dashboard.html"
        class="logo"
    >

        <img
            src="logo.png"
            alt="0X1GHOST Logo"
        >

    </a>


    <a
        href="challenges.html"
        class="back-btn"
    >
        ← CHALLENGES
    </a>


</nav>


<main class="container">


    <div id="challengeContainer">

        Loading challenge...

    </div>


</main>


<div
    id="solversOverlay"
    class="solvers-overlay"
>


    <div class="solvers-modal">


        <div class="solvers-header">

            <h2>
                SOLVED BY
            </h2>


            <button
                id="closeSolvers"
                class="close-solvers"
                type="button"
            >
                ×
            </button>

        </div>


        <div
            id="solversContent"
            class="solvers-content"
        >

            <div class="loading-solvers">
                Loading...
            </div>

        </div>


    </div>


</div>


<script type="module">


    import {
        createClient
    }

    from
    "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


    /* =========================================
       SUPABASE
    ========================================= */

    const SUPABASE_URL =
        "https://borturaxifoxufixewya.supabase.co";


    const SUPABASE_KEY =
        "sb_publishable__lZmTM96oe10-rurqgrujg__ta_C4wr";


    const supabase =
        createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    /* =========================================
       ELEMENTS
    ========================================= */

    const challengeContainer =
        document.getElementById(
            "challengeContainer"
        );


    const solversOverlay =
        document.getElementById(
            "solversOverlay"
        );


    const solversContent =
        document.getElementById(
            "solversContent"
        );


    const closeSolvers =
        document.getElementById(
            "closeSolvers"
        );


    /* =========================================
       GET URL ID
    ========================================= */

    const params =
        new URLSearchParams(
            window.location.search
        );


    const challengeId =
        params.get("id");


    /* =========================================
       LOAD CHALLENGE FROM SUPABASE
    ========================================= */

    async function loadChallenge() {


        if (!challengeId) {

            showNotFound();

            return;

        }


        let challenge = null;


        /*
         * First try the real numeric database ID.
         */

        const numericId =
            Number(challengeId);


        if (
            Number.isInteger(numericId)
        ) {

            const {
                data,
                error
            } =
            await supabase
                .from("challenges")
                .select(
                    "id, title, description, category, difficulty, points, flag"
                )
                .eq(
                    "id",
                    numericId
                )
                .maybeSingle();


            if (error) {

                console.error(
                    error
                );

            }


            if (data) {

                challenge =
                    data;

            }

        }


        /*
         * Backward compatibility:
         * old links such as:
         *
         * challenge.html?id=emoji-cipher
         */

        if (!challenge) {

            const titleMap = {

                "caesar":
                    "Caesar's Secret",

                "rot13":
                    "What type this rot?",

                "binary":
                    "Binary Secret",

                "base64":
                    "What is this?",

                "vigenere":
                    "The secret key",

                "many-layers":
                    "Many layers of encryption",

                "substitution":
                    "Secret encryption",

                "xor":
                    "XOR Secret",

                "shuffled-letters":
                    "Shuffled Letters",

                "emoji-cipher":
                    "EMOJI CIPHER",

                "rsa-small-d":
                    "RSA: Small d Attack",

                "custom-base64":
                    "Custom Base64",

                "what-is-this-2":
                    "WHAT IS THIS 2"

            };


            const title =
                titleMap[
                    challengeId
                ];


            if (title) {

                const {
                    data,
                    error
                } =
                await supabase
                    .from("challenges")
                    .select(
                        "id, title, description, category, difficulty, points, flag"
                    )
                    .eq(
                        "title",
                        title
                    )
                    .maybeSingle();


                if (error) {

                    console.error(
                        error
                    );

                }


                if (data) {

                    challenge =
                        data;

                }

            }

        }


        if (!challenge) {

            showNotFound();

            return;

        }


        renderChallenge(
            challenge
        );

    }


    /* =========================================
       RENDER CHALLENGE
    ========================================= */

    function renderChallenge(
        challenge
    ) {


        document.title =
            challenge.title +
            " | 0X1GHOST";


        /*
         * WHAT IS THIS 2 content.
         */

        let encrypted =
            "";


        let hint =
            "";


        if (
            challenge.title ===
            "WHAT IS THIS 2"
        ) {

            encrypted =
                "AABBABAAABAABAAAAAAABAABBBABBAABBBABAAABABABA";


            hint =
                "";

        }


        /*
         * For all other challenges,
         * use database description.
         */

        challengeContainer.innerHTML = `

            <div class="challenge-box">


                <button
                    id="solveButton"
                    class="solve-btn"
                    type="button"
                >
                    SOLVE
                </button>


                <div class="challenge-type">

                    ${escapeHTML(
                        challenge.category ||
                        "CRYPTOGRAPHY"
                    )}

                </div>


                <h1 class="challenge-title">

                    ${escapeHTML(
                        challenge.title
                    )}

                </h1>


                <p class="challenge-description">

                    ${escapeHTML(
                        challenge.description
                    )}

                </p>


                <div class="encrypted-header">


                    <div class="section-title">

                        ENCRYPTED MESSAGE

                    </div>


                    <button
                        id="copyButton"
                        class="copy-btn"
                        type="button"
                    >
                        COPY
                    </button>


                </div>


                <div
                    id="encryptedMessage"
                    class="encrypted-message"
                >

                    ${escapeHTML(
                        encrypted ||
                        "Use the description above to solve this challenge."
                    )}

                </div>


                ${
                    hint
                    ?
                    `

                        <div class="section-title">
                            HINT
                        </div>

                        <div class="hint-box">
                            ${escapeHTML(hint)}
                        </div>

                    `
                    :
                    ""
                }


                <label
                    class="answer-label"
                    for="answer"
                >
                    SUBMIT FLAG
                </label>


                <input
                    id="answer"
                    class="answer-input"
                    type="text"
                    placeholder="0X1GHOST{...}"
                    autocomplete="off"
                    spellcheck="false"
                >


                <button
                    id="submitButton"
                    class="submit-btn"
                    type="button"
                >
                    SUBMIT ANSWER
                </button>


                <div
                    id="message"
                    class="message"
                ></div>


            </div>

        `;


        const answerInput =
            document.getElementById(
                "answer"
            );


        const submitButton =
            document.getElementById(
                "submitButton"
            );


        const messageElement =
            document.getElementById(
                "message"
            );


        const copyButton =
            document.getElementById(
                "copyButton"
            );


        const solveButton =
            document.getElementById(
                "solveButton"
            );


        /* =====================================
           COPY
        ===================================== */

        copyButton.addEventListener(
            "click",
            async function() {

                try {

                    await navigator.clipboard.writeText(
                        encrypted
                    );


                    copyButton.textContent =
                        "COPIED! ✓";


                    copyButton.classList.add(
                        "copied"
                    );


                    setTimeout(
                        function() {

                            copyButton.textContent =
                                "COPY";


                            copyButton.classList.remove(
                                "copied"
                            );

                        },
                        2000
                    );

                }

                catch (error) {

                    console.error(
                        error
                    );

                }

            }
        );


        /* =====================================
           SOLVE
        ===================================== */

        solveButton.addEventListener(
            "click",
            showSolvers
        );


        /* =====================================
           SUBMIT
        ===================================== */

        submitButton.addEventListener(
            "click",
            submitAnswer
        );


        answerInput.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key === "Enter"
                ) {

                    submitAnswer();

                }

            }
        );


        /* =====================================
           SUBMIT ANSWER
        ===================================== */

        async function submitAnswer() {


            const answer =
                answerInput.value.trim();


            if (!answer) {

                showMessage(
                    "Please enter your answer.",
                    "error"
                );

                return;

            }


            submitButton.disabled =
                true;


            submitButton.textContent =
                "CHECKING...";


            try {


                const {
                    data: {
                        user
                    },
                    error: userError
                } =
                await supabase.auth.getUser();


                if (
                    userError ||
                    !user
                ) {

                    showMessage(
                        "You must be logged in.",
                        "error"
                    );


                    submitButton.disabled =
                        false;


                    submitButton.textContent =
                        "SUBMIT ANSWER";


                    return;

                }


                /*
                 * IMPORTANT:
                 *
                 * challenge.id is the REAL bigint
                 * ID from Supabase.
                 */

                const {
                    data,
                    error
                } =
                await supabase.rpc(
                    "submit_challenge_answer",
                    {

                        p_challenge_id:
                            challenge.id,

                        p_answer:
                            answer

                    }
                );


                submitButton.disabled =
                    false;


                submitButton.textContent =
                    "SUBMIT ANSWER";


                if (error) {

                    console.error(
                        error
                    );


                    showMessage(
                        error.message ||
                        "Something went wrong.",
                        "error"
                    );


                    return;

                }


                if (!data) {

                    showMessage(
                        "No response received from the server.",
                        "error"
                    );


                    return;

                }


                /* =================================
                   RATE LIMIT
                ================================= */

                if (
                    data.rate_limited
                ) {

                    const seconds =
                        data.seconds_remaining ||
                        10;


                    showMessage(
                        data.message ||
                        "Too many attempts. Please wait " +
                        seconds +
                        " seconds.",
                        "warning"
                    );


                    startCooldown(
                        seconds
                    );


                    return;

                }


                /* =================================
                   WRONG
                ================================= */

                if (
                    !data.success
                ) {

                    showMessage(
                        data.message ||
                        "Incorrect answer.",
                        "error"
                    );


                    return;

                }


                /* =================================
                   CORRECT
                ================================= */

                showMessage(
                    `✓ Correct answer! You earned ${data.points} points. New score: ${data.new_score}`,
                    "success"
                );


                answerInput.disabled =
                    true;


                submitButton.disabled =
                    true;


                submitButton.textContent =
                    "SOLVED ✓";

            }


            catch (error) {

                console.error(
                    error
                );


                submitButton.disabled =
                    false;


                submitButton.textContent =
                    "SUBMIT ANSWER";


                showMessage(
                    "Connection error. Please try again.",
                    "error"
                );

            }

        }


        /* =====================================
           SHOW SOLVERS
        ===================================== */

        async function showSolvers() {


            solversOverlay.classList.add(
                "active"
            );


            solversContent.innerHTML = `

                <div class="loading-solvers">
                    Loading...
                </div>

            `;


            solveButton.disabled =
                true;


            try {


                const {
                    data: solves,
                    error: solvesError
                } =
                await supabase
                    .from("challenge_solves")
                    .select(
                        "user_id"
                    )
                    .eq(
                        "challenge_id",
                        challenge.id
                    );


                if (solvesError) {

                    throw solvesError;

                }


                if (
                    !solves ||
                    solves.length === 0
                ) {

                    solversContent.innerHTML = `

                        <div class="no-solvers">

                            No one has solved this challenge yet.

                        </div>

                    `;

                    return;

                }


                const userIds = [
                    ...new Set(
                        solves
                            .map(
                                solve =>
                                    solve.user_id
                            )
                            .filter(Boolean)
                    )
                ];


                if (
                    userIds.length === 0
                ) {

                    solversContent.innerHTML = `

                        <div class="no-solvers">

                            No solvers found.

                        </div>

                    `;

                    return;

                }


                const {
                    data: profiles,
                    error: profilesError
                } =
                await supabase
                    .from("profiles")
                    .select(
                        "id, username"
                    )
                    .in(
                        "id",
                        userIds
                    );


                if (profilesError) {

                    throw profilesError;

                }


                const profileMap =
                    new Map();


                (profiles || []).forEach(
                    profile => {

                        profileMap.set(
                            profile.id,
                            profile.username
                        );

                    }
                );


                let html = `

                    <div class="solver-count">

                        ${userIds.length}
                        ${
                            userIds.length === 1
                            ? "player"
                            : "players"
                        }
                        solved this challenge.

                    </div>


                    <div class="solver-list">

                `;


                userIds.forEach(
                    function(
                        userId,
                        index
                    ) {

                        const username =
                            profileMap.get(
                                userId
                            ) ||
                            "Unknown user";


                        html += `

                            <div class="solver-item">

                                <div class="solver-number">

                                    ${index + 1}

                                </div>


                                <div class="solver-name">

                                    ${escapeHTML(
                                        username
                                    )}

                                </div>

                            </div>

                        `;

                    }
                );


                html += `

                    </div>

                `;


                solversContent.innerHTML =
                    html;

            }


            catch (error) {

                console.error(
                    error
                );


                solversContent.innerHTML = `

                    <div class="no-solvers">

                        Unable to load the solvers.

                        <br>

                        Please try again.

                    </div>

                `;

            }


            finally {

                solveButton.disabled =
                    false;

            }

        }


        /* =====================================
           CLOSE SOLVERS
        ===================================== */

        closeSolvers.addEventListener(
            "click",
            function() {

                solversOverlay.classList.remove(
                    "active"
                );

            }
        );


        solversOverlay.addEventListener(
            "click",
            function(event) {

                if (
                    event.target ===
                    solversOverlay
                ) {

                    solversOverlay.classList.remove(
                        "active"
                    );

                }

            }
        );


        document.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key === "Escape"
                ) {

                    solversOverlay.classList.remove(
                        "active"
                    );

                }

            }
        );


        /* =====================================
           COOLDOWN
        ===================================== */

        function startCooldown(
            seconds
        ) {

            let remaining =
                Math.max(
                    1,
                    Number(seconds) || 10
                );


            answerInput.disabled =
                true;


            submitButton.disabled =
                true;


            submitButton.textContent =
                `WAIT ${remaining}s`;


            const timer =
                setInterval(
                    function() {

                        remaining--;


                        if (
                            remaining <= 0
                        ) {

                            clearInterval(
                                timer
                            );


                            answerInput.disabled =
                                false;


                            submitButton.disabled =
                                false;


                            submitButton.textContent =
                                "SUBMIT ANSWER";


                            return;

                        }


                        submitButton.textContent =
                            `WAIT ${remaining}s`;

                    },
                    1000
                );

        }


        /* =====================================
           MESSAGE
        ===================================== */

        function showMessage(
            text,
            type
        ) {

            messageElement.textContent =
                text;


            messageElement.className =
                "message " +
                type;

        }

    }


    /* =========================================
       NOT FOUND
    ========================================= */

    function showNotFound() {

        challengeContainer.innerHTML = `

            <div class="not-found">

                <h1>
                    Challenge Not Found
                </h1>


                <p>
                    The requested challenge does not exist.
                </p>


                <a
                    href="challenges.html"
                    class="back-btn"
                >
                    ← BACK TO CHALLENGES
                </a>

            </div>

        `;

    }


    /* =========================================
       ESCAPE HTML
    ========================================= */

    function escapeHTML(
        value
    ) {

        return String(value)

            .replaceAll(
                "&",
                "&amp;"
            )

            .replaceAll(
                "<",
                "&lt;"
            )

            .replaceAll(
                ">",
                "&gt;"
            )

            .replaceAll(
                '"',
                "&quot;"
            )

            .replaceAll(
                "'",
                "&#039;"
            );

    }


    /* =========================================
       START
    ========================================= */

    loadChallenge();

</script>


</body>

</html>
