<style>

    .title {
        font-size: 30px;
    }

    .badge {
        border: 1px solid #00ff88;
        color: #00ff88;
        padding: 7px 10px;
        border-radius: 5px;
        font-size: 12px;
        font-weight: bold;
    }

    .description {
        color: #999;
        line-height: 1.7;
        margin-bottom: 25px;
    }

    .message-box {

        border-radius: 8px;
        padding: 25px;

    }

    .message-title {

        font-size: 12px;

    }

    .message-row {

        gap: 12px;
    }

    .message {

        word-break: break-word;
    }

    .copy-btn {
        flex-shrink: 0;
        background: #111;

        border: 1px solid #333;

    .copy-btn:hover {

    .answer-label {

        margin-bottom: 8px;
    }

    .answer-input {
        width: 100%;
        padding: 13px;
        background: #070707;
        border: 1px solid #333;
        border-radius: 7px;
        color: white;
        outline: none;
        font-size: 15px;
    }

    .answer-input:focus {
        border-color: #00ff88;
    }

    .submit-btn {
        margin-top: 15px;
        padding: 12px 20px;
        background: #00ff88;
        border: none;
        border-radius: 7px;
        color: #050505;
        font-weight: bold;
        cursor: pointer;
    }

    .submit-btn:hover {
        box-shadow:
            0 0 20px rgba(0, 255, 136, 0.15);
    }

    .result {
        margin-top: 20px;

        border-radius: 7px;

        line-height: 1.5;
    }

    .success {

        color: #00ff88;
        border: 1px solid #00ff88;

    }

    .error {
        display: block;
        color: #ff6b6b;
        border: 1px solid #ff6b6b;
        background: rgba(255, 107, 107, 0.05);
    }

    .points {
        color: #00ff88;

    }

    @media (max-width: 600px) {

        .navbar {
            padding: 15px 18px;
        }

        .container {

        .challenge {

        }

        .top {

            align-items: flex-start;
        }

        .message-row {
            flex-direction: column;
        }

</main>

<script type="module">

    import {
        createClient
    } from
    "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


    const SUPABASE_URL =
        "https://borturaxifoxufixewya.supabase.co";


    const SUPABASE_KEY =
        "sb_publishable__lZmTM96oe10-rurqgrujg__ta_C4wr";


    const supabase =
        createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    const challenges = {

        caesar: {

            name: "Caesar's Secret",
            difficulty: "EASY · 100 PTS",
            points: 100,

            description:
                "Caesar has hidden a secret message using a classical Caesar cipher. Decode the message and submit the correct flag.",

            message:
                "FDHVDU",

            answer:
                "0X1GHOST{CAESAR}"

        },


        binary: {

            name: "Binary Flag",
            difficulty: "EASY · 100 PTS",
            points: 100,

            description:
                "A secret flag has been converted into binary. Decode the binary ciphertext and submit the correct flag.",

            message:
                "00110000 01011000 00110001 01000111 01001000 01001111 01010011 01010100 01111011 01100111 00110000 00110000 01100100 01011111 01101010 00110000 00110100 01011111 01110100 01101000 00110011 00110110 01011111 01100001 00110011 00110111 00110010 01111101",

            answer:
                "0X1GHOST{g00d_j04_th36_a372}"

        },


        "coming-medium": {

            name: "Coming Soon",
            difficulty: "MEDIUM · 200 PTS",
            points: 200,

            description:
                "This challenge is currently being prepared.",

            message:
                "COMING SOON",

            answer:
                ""

        },


        "coming-medium-hard": {

            name: "Coming Soon",
            difficulty: "MEDIUM HARD · 300 PTS",
            points: 300,

            description:
                "This challenge is currently being prepared.",

            message:
                "COMING SOON",

            answer:
                ""

        },


        "coming-hard": {

            name: "Coming Soon",
            difficulty: "HARD · 500 PTS",
            points: 500,

            description:
                "This challenge is currently being prepared.",

            message:
                "COMING SOON",

            answer:
                ""

        }

    };


    const params =
        new URLSearchParams(
            window.location.search
        );


    const challengeId =
        params.get("id");


    const challenge =
        challenges[challengeId];


    const challengeName =
        document.getElementById("challengeName");

    const challengeBadge =
        document.getElementById("challengeBadge");

    const challengeDescription =
        document.getElementById("challengeDescription");

    const challengeMessage =
        document.getElementById("challengeMessage");

    const answerForm =
        document.getElementById("answerForm");

    const answerInput =
        document.getElementById("answer");

    const result =
        document.getElementById("result");

    const copyButton =
        document.getElementById("copyButton");


    if (!challenge) {

        challengeName.textContent =
            "Challenge Not Found";

        challengeBadge.textContent =
            "ERROR";

        challengeDescription.textContent =
            "The requested challenge does not exist.";

        challengeMessage.textContent =
            "404";

        answerForm.style.display =
            "none";

        copyButton.style.display =
            "none";

    } else {

        challengeName.textContent =
            challenge.name;

        challengeBadge.textContent =
            challenge.difficulty;

        challengeDescription.textContent =
            challenge.description;

        challengeMessage.textContent =
            challenge.message;

    }


    copyButton.addEventListener(
        "click",
        async function() {

            if (!challenge) return;

            try {

                await navigator.clipboard.writeText(
                    challenge.message
                );

                const oldText =
                    copyButton.textContent;

                copyButton.textContent =
                    "COPIED ✓";

                setTimeout(
                    function() {
                        copyButton.textContent =
                            oldText;
                    },
                    1500
                );

            } catch (error) {

                console.error(error);

                copyButton.textContent =
                    "FAILED";

            }

        }
    );


    answerForm.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();

            if (!challenge) return;


            const {
                data: {
                    user
                }
            } =
                await supabase.auth.getUser();


            if (!user) {

                window.location.href =
                    "index.html";

                return;

            }


            const userAnswer =
                answerInput.value
                    .trim();


            const {
                data,
                error
            } =
                await supabase.rpc(
                    "submit_challenge_answer",
                    {
                        p_challenge_id:
                            challengeId,

                        p_answer:
                            userAnswer
                    }
                );


            if (error) {

                console.error(error);

                result.className =
                    "result error";

                result.textContent =
                    "An error occurred while checking your answer.";

                return;

            }


            if (
                data &&
                data.success
            ) {

                result.className =
                    "result success";

                result.innerHTML =
                    `
                    Correct! 🎉
                    You earned
                    <span class="points">
                        ${data.points} points
                    </span>.
                    `;


                answerInput.disabled =
                    true;

                document.querySelector(
                    ".submit-btn"
                ).disabled =
                    true;

            } else if (
                data &&
                data.already_solved
            ) {

                result.className =
                    "result success";

                result.textContent =
                    "You already solved this challenge.";

            } else {

                result.className =
                    "result error";

                result.textContent =
                    data?.message ||
                    "Incorrect answer. Try again.";

            }

        }
    );

</script>
