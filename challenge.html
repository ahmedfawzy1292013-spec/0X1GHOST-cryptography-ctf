<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Challenge | 0X1GHOST</title>

    <link
        rel="icon"
        type="image/png"
        href="favicon.png"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }


        body {
            min-height: 100vh;

            background: #050505;

            color: white;
        }


        .navbar {
            min-height: 70px;

            border-bottom: 1px solid #222;

            background: #090909;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 12px 35px;
        }


        .logo img {
            display: block;

            width: 150px;

            max-height: 55px;

            object-fit: contain;
        }


        .back-btn {
            display: inline-block;

            color: #aaa;

            text-decoration: none;

            font-size: 13px;

            font-weight: bold;

            padding: 10px 14px;

            border: 1px solid #222;

            border-radius: 7px;

            background: #0b0b0b;
        }


        .back-btn:hover {
            color: #00ff88;

            border-color: #00ff88;
        }


        .container {
            width: 100%;

            max-width: 1000px;

            margin: auto;

            padding: 50px 25px;
        }


        .challenge-box {
            position: relative;

            background: #0d0d0d;

            border: 1px solid #222;

            border-radius: 12px;

            padding: 35px;
        }


        .challenge-type {
            color: #00ff88;

            font-size: 12px;

            font-weight: bold;

            letter-spacing: 1px;

            margin-bottom: 12px;

            padding-right: 110px;
        }


        .challenge-title {
            font-size: 32px;

            margin-bottom: 15px;

            padding-right: 110px;
        }


        .challenge-description {
            color: #888;

            line-height: 1.7;

            white-space: pre-line;

            margin-bottom: 35px;
        }


        .solve-btn {
            position: absolute;

            top: 30px;

            right: 30px;

            padding: 9px 15px;

            border: 1px solid #00ff88;

            border-radius: 7px;

            background: rgba(0,255,136,0.08);

            color: #00ff88;

            cursor: pointer;

            font-size: 12px;

            font-weight: bold;
        }


        .solve-btn:hover {
            background: rgba(0,255,136,0.15);
        }


        .solve-btn:disabled {
            opacity: 0.5;

            cursor: not-allowed;
        }


        .encrypted-header {
            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

            margin-bottom: 10px;
        }


        .section-title {
            font-size: 15px;

            font-weight: bold;

            color: #ddd;

            margin-bottom: 12px;
        }


        .copy-btn {
            background: #101010;

            border: 1px solid #333;

            color: #aaa;

            border-radius: 6px;

            padding: 7px 12px;

            cursor: pointer;

            font-size: 11px;

            font-weight: bold;
        }


        .copy-btn:hover,
        .copy-btn.copied {
            color: #00ff88;

            border-color: #00ff88;
        }


        .encrypted-message {
            background: #070707;

            border: 1px solid #222;

            border-radius: 8px;

            padding: 20px;

            margin-bottom: 30px;

            color: #00ff88;

            font-family:
                "Courier New",
                monospace;

            font-size: 14px;

            line-height: 1.7;

            white-space: pre-wrap;

            overflow-wrap: anywhere;

            max-height: 500px;

            overflow-y: auto;
        }


        .hint-box {
            background: rgba(255,209,102,0.05);

            border: 1px solid rgba(255,209,102,0.25);

            color: #ffd166;

            border-radius: 8px;

            padding: 15px;

            margin-bottom: 30px;

            line-height: 1.6;

            white-space: pre-line;
        }


        .answer-label {
            display: block;

            color: #aaa;

            font-size: 12px;

            font-weight: bold;

            margin-bottom: 8px;
        }


        .answer-input {
            width: 100%;

            background: #070707;

            border: 1px solid #333;

            color: white;

            border-radius: 7px;

            padding: 14px;

            outline: none;

            font-family:
                "Courier New",
                monospace;

            font-size: 14px;

            margin-bottom: 12px;
        }


        .answer-input:focus {
            border-color: #00ff88;
        }


        .answer-input:disabled {
            opacity: 0.5;
        }


        .submit-btn {
            width: 100%;

            padding: 14px;

            background: #00ff88;

            border: none;

            border-radius: 7px;

            color: #000;

            cursor: pointer;

            font-weight: bold;

            font-size: 13px;
        }


        .submit-btn:hover {
            opacity: 0.9;
        }


        .submit-btn:disabled {
            opacity: 0.5;

            cursor: not-allowed;
        }


        .message {
            margin-top: 15px;

            padding: 13px;

            border-radius: 7px;

            font-size: 13px;

            line-height: 1.5;

            display: none;
        }


        .message.success {
            display: block;

            color: #00ff88;

            border: 1px solid rgba(0,255,136,0.3);

            background: rgba(0,255,136,0.06);
        }


        .message.error {
            display: block;

            color: #ff6b6b;

            border: 1px solid rgba(255,107,107,0.3);

            background: rgba(255,107,107,0.06);
        }


        .message.warning {
            display: block;

            color: #ffd166;

            border: 1px solid rgba(255,209,102,0.3);

            background: rgba(255,209,102,0.06);
        }


        .not-found {
            text-align: center;

            padding: 60px 20px;

            background: #0d0d0d;

            border: 1px solid #222;

            border-radius: 12px;
        }

            margin-bottom: 15px;
        }


        .not-found p {
            color: #777;

            margin-bottom: 25px;
        }

           SOLVERS MODAL
           ========================================= */

            position: fixed;

            inset: 0;

            z-index: 1000;

            display: none;

            align-items: center;

            justify-content: center;

            padding: 20px;

            background: rgba(0,0,0,0.75);
        }

        }

            width: 100%;

            max-width: 500px;

            max-height: 80vh;

            overflow: hidden;

            background: #0d0d0d;

            border: 1px solid #292929;

            border-radius: 12px;
        }


        .solvers-header {
            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 20px;

            border-bottom: 1px solid #222;
        }


        .solvers-header h2 {
            color: #00ff88;

            font-size: 18px;
        }


        .close-solvers {
            background: transparent;

            border: none;

            color: #777;

            font-size: 25px;

            cursor: pointer;
        }


        .close-solvers:hover {
            color: #00ff88;
        }


        .solvers-content {
            padding: 20px;

            max-height: 60vh;

            overflow-y: auto;
        }


        .solver-count {
            color: #777;

            font-size: 13px;

            margin-bottom: 15px;
        }


        .solver-list {
            display: flex;

            flex-direction: column;

            gap: 10px;
        }


        .solver-item {
            display: flex;

            align-items: center;

            gap: 12px;

            background: #080808;

            border: 1px solid #222;

            border-radius: 7px;

            padding: 12px 14px;
        }


        .solver-number {
            width: 28px;

            height: 28px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 50%;

            background: #101010;

            border: 1px solid #333;

            color: #00ff88;

            font-size: 12px;

            font-weight: bold;

        }


        .solver-name {
            color: white;

            font-size: 14px;

        }


        .no-solvers {
            text-align: center;

            color: #777;

            line-height: 1.6;

            }

                right: 18px;

            }


            .challenge-type,
            .challenge-title {
                padding-right: 85px;
            }


            .solvers-modal {
                max-height: 85vh;
            }

        }

    </style>

</head>

const hints = {

/* =========================================
   LOAD CHALLENGE FROM DATABASE
   ========================================= */

async function loadChallenge() {

    if (!requestedId) {

        showNotFound();

        return;

    }


    let query;


    /*
     * Accept both:
     *
     * ?id=caesar
     *
     * and old links:
     *
     * ?id=1
     */

    if (/^[0-9]+$/.test(requestedId)) {

        query =
            supabase
                .from("challenges")
                .select(
                    "id,title,description,difficulty,points,slug"
                )
                .eq(
                    "id",
                    Number(requestedId)
                )
                .limit(1);

    }

    else {

        query =
            supabase
                .from("challenges")
                .select(
                    "id,title,description,difficulty,points,slug"
                )
                .eq(
                    "slug",
                    requestedId
                )
                .limit(1);

    }


    const {
        data,
        error
    } = await query;


    if (error) {

        console.error(error);

        challengeContainer.innerHTML = `

            <div class="not-found">

                <h1>
                    Database Error
                </h1>

                <p>
                    ${escapeHTML(error.message)}
                </p>

                <a
                    href="challenges.html"
                    class="back-btn"
                >
                    ← BACK TO CHALLENGES
                </a>

            </div>

        `;

        return;

    }


    if (!data || data.length === 0) {

        showNotFound();

        return;

    }


    const challenge =
        data[0];


    const slug =
        challenge.slug;


    /*
     * If the database challenge exists but the encrypted
     * message was not defined in this file, show an error
     * instead of a fake challenge.
     */

    if (
        !Object.prototype.hasOwnProperty.call(
            encryptedMessages,
            slug
        )
    ) {

        challengeContainer.innerHTML = `

            <div class="not-found">

                <h1>
                    Challenge Configuration Error
                </h1>

                <p>
                    This challenge exists in the database,
                    but its encrypted message is missing
                    from challenge.html.
                </p>

                <a
                    href="challenges.html"
                    class="back-btn"
                >
                    ← BACK TO CHALLENGES
                </a>

            </div>

        `;

        return;

    }


    document.title =
        challenge.title +
        " | 0X1GHOST";


    renderChallenge(
        challenge
    );

}


/* =========================================
   RENDER CHALLENGE
   ========================================= */

function renderChallenge(challenge) {

    const encrypted =
        encryptedMessages[
            challenge.slug
        ];


    const hint =
        hints[
            challenge.slug
        ] || "";


    challengeContainer.innerHTML = `

        <div class="challenge-box">


            <button
                id="solveButton"
                class="solve-btn"
                type="button"
            >
                SOLVE
            </button>


            <div class="challenge-type">

                ${escapeHTML(
                    challenge.difficulty
                )}
                —
                ${escapeHTML(
                    challenge.points
                )}
                POINTS

            </div>


            <h1 class="challenge-title">

                ${escapeHTML(
                    challenge.title
                )}

            </h1>


            <p class="challenge-description">

                ${escapeHTML(
                    challenge.description || ""
                )}

            </p>


            <div class="encrypted-header">

                <div class="section-title">
                    ENCRYPTED MESSAGE
                </div>


                <button
                    id="copyButton"
                    class="copy-btn"
                    type="button"
                >
                    COPY
                </button>

            </div>


            <div
                id="encryptedMessage"
                class="encrypted-message"
            >${escapeHTML(
                encrypted
            )}</div>


            ${
                hint
                ?
                `

                    <div class="section-title">
                        HINT
                    </div>


                    <div class="hint-box">

                        ${escapeHTML(
                            hint
                        )}

                    </div>

                `
                :
                ""
            }


            <label
                class="answer-label"
                for="answer"
            >
                SUBMIT FLAG
            </label>


            <input
                id="answer"
                class="answer-input"
                type="text"
                placeholder="0X1GHOST{...}"
                autocomplete="off"
                spellcheck="false"
            >


            <button
                id="submitButton"
                class="submit-btn"
                type="button"
            >
                SUBMIT ANSWER
            </button>


            <div
                id="message"
                class="message"
            ></div>


        </div>

    `;


    const answerInput =
        document.getElementById(
            "answer"
        );


    const submitButton =
        document.getElementById(
            "submitButton"
        );


    const messageElement =
        document.getElementById(
            "message"
        );


    const copyButton =
        document.getElementById(
            "copyButton"
        );


    const solveButton =
        document.getElementById(
            "solveButton"
        );


    /* =====================================
       COPY
       ===================================== */

    copyButton.addEventListener(
        "click",
        async function() {

            try {

                await navigator.clipboard.writeText(
                    encrypted
                );


                copyButton.textContent =
                    "COPIED! ✓";


                copyButton.classList.add(
                    "copied"
                );


                setTimeout(
                    function() {

                        copyButton.textContent =
                            "COPY";


                        copyButton.classList.remove(
                            "copied"
                        );

                    },
                    2000
                );

            }

            catch (error) {

                console.error(error);

                copyButton.textContent =
                    "FAILED";


                setTimeout(
                    function() {

                        copyButton.textContent =
                            "COPY";

                    },
                    2000
                );

            }

        }
    );


    /* =====================================
       SOLVE BUTTON
       ===================================== */

    solveButton.addEventListener(
        "click",
        showSolvers
    );


    /* =====================================
       SUBMIT
       ===================================== */

    submitButton.addEventListener(
        "click",
        submitAnswer
    );


    answerInput.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                submitAnswer();

            }

        }
    );


    /* =====================================
       SUBMIT ANSWER
       ===================================== */

    async function submitAnswer() {

        const answer =
            answerInput.value.trim();


        if (!answer) {

            showMessage(
                "Please enter your answer.",
                "error"
            );

            return;

        }


        submitButton.disabled =
            true;


        submitButton.textContent =
            "CHECKING...";


        try {

            const {
                data: {
                    user
                },
                error: userError
            } =
            await supabase.auth.getUser();


            if (
                userError ||
                !user
            ) {

                showMessage(
                    "You must be logged in.",
                    "error"
                );


                submitButton.disabled =
                    false;


                submitButton.textContent =
                    "SUBMIT ANSWER";


                return;

            }


            /*
             * VERY IMPORTANT:
             *
             * Send the SLUG, not the database ID.
             */

            const {
                data,
                error
            } =
            await supabase.rpc(
                "submit_challenge_answer",
                {
                    p_challenge_id:
                        challenge.slug,

                    p_answer:
                        answer
                }
            );


            submitButton.disabled =
                false;


            submitButton.textContent =
                "SUBMIT ANSWER";


            if (error) {

                console.error(error);

                showMessage(
                    error.message ||
                    "Something went wrong.",
                    "error"
                );

                return;

            }


            if (!data) {

                showMessage(
                    "No response received from the server.",
                    "error"
                );

                return;

            }


            if (!data.success) {

                showMessage(
                    data.message ||
                    "Incorrect answer.",
                    "error"
                );

                return;

            }


            showMessage(
                `✓ Correct answer! You earned ${data.points} points. New score: ${data.new_score}`,
                "success"
            );


            answerInput.disabled =
                true;


            submitButton.disabled =
                true;


            submitButton.textContent =
                "SOLVED ✓";

        }

        catch (error) {

            console.error(error);


            submitButton.disabled =
                false;


            submitButton.textContent =
                "SUBMIT ANSWER";


            showMessage(
                "Connection error. Please try again.",
                "error"
            );

        }

    }


    /* =====================================
       SHOW SOLVERS
       ===================================== */

    async function showSolvers() {

        solversOverlay.classList.add(
            "active"
        );


        solversContent.innerHTML = `

            <div class="loading-solvers">
                Loading...
            </div>

        `;


        solveButton.disabled =
            true;


        try {

            const {
                data: solves,
                error: solvesError
            } =
            await supabase
                .from("challenge_solves")
                .select("user_id")
                .eq(
                    "challenge_id",
                    challenge.slug
                );


            if (solvesError) {

                throw solvesError;

            }


            if (
                !solves ||
                solves.length === 0
            ) {

                solversContent.innerHTML = `

                    <div class="no-solvers">
                        No one has solved this challenge yet.
                    </div>

                `;

                return;

            }


            const userIds = [
                ...new Set(
                    solves
                        .map(
                            solve =>
                                solve.user_id
                        )
                        .filter(Boolean)
                )
            ];


            if (
                userIds.length === 0
            ) {

                solversContent.innerHTML = `

                    <div class="no-solvers">
                        No solvers found.
                    </div>

                `;

                return;

            }


            const {
                data: profiles,
                error: profilesError
            } =
            await supabase
                .from("profiles")
                .select(
                    "id, username"
                )
                .in(
                    "id",
                    userIds
                );


            if (profilesError) {

                throw profilesError;

            }


            const profileMap =
                new Map();


            (profiles || []).forEach(
                profile => {

                    profileMap.set(
                        profile.id,
                        profile.username
                    );

                }
            );


            let html = `

                <div class="solver-count">

                    ${userIds.length}

                    ${
                        userIds.length === 1
                        ? "player"
                        : "players"
                    }

                    solved this challenge.

                </div>


                <div class="solver-list">

            `;


            userIds.forEach(
                function(userId, index) {

                    const username =
                        profileMap.get(
                            userId
                        ) ||
                        "Unknown user";


                    html += `

                        <div class="solver-item">

                            <div class="solver-number">
                                ${index + 1}
                            </div>


                            <div class="solver-name">

                                ${escapeHTML(
                                    username
                                )}

                            </div>

                        </div>

                    `;

                }
            );


            html += `
                </div>
            `;


            solversContent.innerHTML =
                html;

        }

        catch (error) {

            console.error(error);


            solversContent.innerHTML = `

                <div class="no-solvers">

                    Unable to load the solvers.

                    <br>

                    Please try again.

                </div>

            `;

        }

        finally {

            solveButton.disabled =
                false;

        }

    }


    /* =====================================
       CLOSE SOLVERS
       ===================================== */

    closeSolvers.addEventListener(
        "click",
        function() {

            solversOverlay.classList.remove(
                "active"
            );

        }
    );


    solversOverlay.addEventListener(
        "click",
        function(event) {

            if (
                event.target ===
                solversOverlay
            ) {

                solversOverlay.classList.remove(
                    "active"
                );

            }

        }
    );


    document.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Escape"
            ) {

                solversOverlay.classList.remove(
                    "active"
                );

            }

        }
    );


}


/* =========================================
   NOT FOUND
   ========================================= */

function showNotFound() {

    challengeContainer.innerHTML = `

        <div class="not-found">

            <h1>
                Challenge Not Found
            </h1>


            <p>
                The requested challenge does not exist.
            </p>


            <a
                href="challenges.html"
                class="back-btn"
            >
                ← BACK TO CHALLENGES
            </a>

        </div>

    `;

}


/* =========================================
   MESSAGE
   ========================================= */

function showMessage(
    text,
    type
) {

    const messageElement =
        document.getElementById(
            "message"
        );


    messageElement.textContent =
        text;


    messageElement.className =
        "message " +
        type;

}


/* =========================================
   ESCAPE HTML
   ========================================= */

function escapeHTML(value) {

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


/* =========================================
   START
   ========================================= */

loadChallenge();

</script>
