<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>My Profile | 0X1GHOST</title>

<link
    rel="icon"
    type="image/png"
    href="favicon.png"
>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body {

    min-height: 100vh;

    background: #050505;

    color: white;

}

.navbar {

    min-height: 70px;

    border-bottom: 1px solid #222;

    background: #090909;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 12px 35px;

    gap: 20px;

}

.logo {

    display: flex;

    align-items: center;

    text-decoration: none;

}

.logo img {

    display: block;

    width: 150px;

    max-height: 55px;

    object-fit: contain;

}

.back-btn {

    text-decoration: none;

    color: #aaa;

    border: 1px solid #333;

    padding: 9px 15px;

    border-radius: 6px;

    transition: 0.2s;

}

.back-btn:hover {

    color: #00ff88;

    border-color: #00ff88;

}

.container {

    width: 100%;

    max-width: 650px;

    margin: auto;

    padding: 55px 25px;

}

.profile-box {

    background: #0d0d0d;

    border: 1px solid #222;

    border-radius: 12px;

    padding: 35px;

}

.title {

    font-size: 30px;

    margin-bottom: 10px;

}

.subtitle {

    color: #777;

    line-height: 1.6;

    margin-bottom: 35px;

}

.input-group {

    margin-bottom: 22px;

}

.input-group label {

    display: block;

    color: #aaa;

    font-size: 13px;

    font-weight: bold;

    margin-bottom: 9px;

}

.input-group input {

    width: 100%;

    padding: 14px;

    background: #070707;

    border: 1px solid #333;

    border-radius: 7px;

    color: white;

    outline: none;

    font-size: 15px;

}

.input-group input:focus {

    border-color: #00ff88;

    box-shadow:
        0 0 8px
        rgba(0, 255, 136, 0.15);

}

.email-note {

    color: #555;

    font-size: 12px;

    margin-top: 7px;

    line-height: 1.5;

}

.password-title {

    color: #00ff88;

    font-size: 14px;

    font-weight: bold;

    margin:

        30px 0
        18px;

    padding-bottom: 10px;

    border-bottom: 1px solid #222;

}

.save-btn {

    width: 100%;

    padding: 14px;

    margin-top: 8px;

    background: #00ff88;

    color: #050505;

    border: none;

    border-radius: 7px;

    font-size: 15px;

    font-weight: bold;

    cursor: pointer;

    transition: 0.2s;

}

.save-btn:hover:not(:disabled) {

    background: #00e67a;

    transform: translateY(-1px);

}

.save-btn:disabled {

    opacity: 0.6;

    cursor: not-allowed;

}

.message {

    display: none;

    margin-top: 20px;

    padding: 15px;

    border-radius: 7px;

    line-height: 1.6;

}

.message.success {

    display: block;

    color: #00ff88;

    background:
        rgba(0, 255, 136, 0.08);

    border: 1px solid #00ff88;

}

.message.error {

    display: block;

    color: #ff6b6b;

    background:
        rgba(255, 107, 107, 0.08);

    border: 1px solid #ff6b6b;

}

@media (max-width: 600px) {

    .navbar {

        padding: 15px 18px;

    }

    .container {

        padding: 35px 18px;

    }

    .profile-box {

        padding: 23px;

    }

    .title {

        font-size: 26px;

    }

    .logo img {

        width: 125px;

    }

}

</style>

</head>

<body>


<nav class="navbar">

<a
    href="dashboard.html"
    class="logo"
>

<img
    src="logo.png"
    alt="0X1GHOST Logo"
>

</a>


<a
    href="dashboard.html"
    class="back-btn"
>

← DASHBOARD

</a>

</nav>


<main class="container">


<div class="profile-box">


<h1 class="title">
    My Profile
</h1>


<p class="subtitle">
    Manage your account information and security settings.
</p>


<div class="input-group">

<label for="username">
    USERNAME
</label>

<input
    type="text"
    id="username"
    minlength="3"
    maxlength="20"
    autocomplete="username"
>

</div>


<div class="input-group">

<label for="email">
    EMAIL
</label>

<input
    type="email"
    id="email"
    autocomplete="email"
>

<div class="email-note">
    Changing your email may require confirmation from the new email address.
</div>

</div>


<div class="password-title">
    CHANGE PASSWORD
</div>


<div class="input-group">

<label for="newPassword">
    NEW PASSWORD
</label>

<input
    type="password"
    id="newPassword"
    minlength="8"
    placeholder="Leave empty to keep current password"
    autocomplete="new-password"
>

</div>


<div class="input-group">

<label for="confirmPassword">
    CONFIRM NEW PASSWORD
</label>

<input
    type="password"
    id="confirmPassword"
    minlength="8"
    placeholder="Confirm your new password"
    autocomplete="new-password"
>

</div>


<button
    class="save-btn"
    id="saveButton"
>

    SAVE CHANGES

</button>


<div
    id="message"
    class="message"
></div>


</div>


</main>


<script type="module">


import {
    createClient
}
from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


const SUPABASE_URL =
    "https://borturaxifoxufixewya.supabase.co";


const SUPABASE_KEY =
    "sb_publishable__lZmTM96oe10-rurqgrujg__ta_C4wr";


const supabase =
    createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const usernameInput =
    document.getElementById(
        "username"
    );


const emailInput =
    document.getElementById(
        "email"
    );


const newPasswordInput =
    document.getElementById(
        "newPassword"
    );


const confirmPasswordInput =
    document.getElementById(
        "confirmPassword"
    );


const saveButton =
    document.getElementById(
        "saveButton"
    );


const message =
    document.getElementById(
        "message"
    );


let currentUser = null;


function showMessage(
    text,
    type
) {

    message.textContent =
        text;

    message.className =
        "message " + type;

}


async function loadProfile() {

    try {

        const {
            data: {
                user
            },
            error: userError
        } =
        await supabase.auth.getUser();


        if (
            userError ||
            !user
        ) {

            window.location.href =
                "index.html";

            return;

        }


        currentUser =
            user;


        emailInput.value =
            user.email || "";


        const {
            data: profile,
            error: profileError
        } =
        await supabase
            .from("profiles")
            .select("username")
            .eq(
                "id",
                user.id
            )
            .maybeSingle();


        if (profileError) {

            console.error(
                profileError
            );

            showMessage(
                "Could not load your profile.",
                "error"
            );

            return;

        }


        if (profile) {

            usernameInput.value =
                profile.username || "";

        }

    }

    catch (error) {

        console.error(error);

        showMessage(
            "Could not load your profile.",
            "error"
        );

    }

}


saveButton.addEventListener(
    "click",
    async function() {

        if (!currentUser) {

            showMessage(
                "You must be logged in.",
                "error"
            );

            return;

        }


        const username =
            usernameInput.value.trim();


        const email =
            emailInput.value.trim();


        const newPassword =
            newPasswordInput.value;


        const confirmPassword =
            confirmPasswordInput.value;


        if (username.length < 3) {

            showMessage(
                "Username must be at least 3 characters.",
                "error"
            );

            return;

        }


        if (username.length > 20) {

            showMessage(
                "Username must be 20 characters or less.",
                "error"
            );

            return;

        }


        if (!email) {

            showMessage(
                "Please enter your email.",
                "error"
            );

            return;

        }


        if (
            newPassword ||
            confirmPassword
        ) {

            if (
                newPassword.length < 8
            ) {

                showMessage(
                    "Password must be at least 8 characters.",
                    "error"
                );

                return;

            }


            if (
                newPassword !==
                confirmPassword
            ) {

                showMessage(
                    "Passwords do not match.",
                    "error"
                );

                return;

            }

        }


        saveButton.disabled =
            true;

        saveButton.textContent =
            "SAVING...";


        try {


            /*
             * =====================================
             * UPDATE USERNAME
             * =====================================
             */

            const {
                data: usernameResult,
                error: usernameError
            } =
            await supabase.rpc(
                "update_my_username",
                {
                    p_username:
                        username
                }
            );


            if (usernameError) {

                throw usernameError;

            }


            if (
                usernameResult &&
                usernameResult.success === false
            ) {

                throw new Error(
                    usernameResult.message ||
                    "Could not update username."
                );

            }


            /*
             * =====================================
             * UPDATE EMAIL
             * =====================================
             */

            if (
                email !==
                currentUser.email
            ) {

                const {
                    error: emailError
                } =
                await supabase.auth.updateUser(
                    {
                        email: email
                    }
                );


                if (emailError) {

                    throw emailError;

                }

            }


            /*
             * =====================================
             * UPDATE PASSWORD
             * =====================================
             */

            if (newPassword) {

                const {
                    error: passwordError
                } =
                await supabase.auth.updateUser(
                    {
                        password:
                            newPassword
                    }
                );


                if (passwordError) {

                    throw passwordError;

                }

            }


            /*
             * =====================================
             * SUCCESS
             * =====================================
             */

            showMessage(
                "Profile updated successfully!",
                "success"
            );


            newPasswordInput.value =
                "";

            confirmPasswordInput.value =
                "";


            /*
             * Update local user object
             */

            const {
                data: {
                    user
                }
            } =
            await supabase.auth.getUser();


            if (user) {

                currentUser =
                    user;

                emailInput.value =
                    user.email || "";

            }


        }

        catch (error) {

            console.error(
                "Profile update error:",
                error
            );


            let errorMessage =
                error.message ||
                "Could not update your profile.";


            if (
                errorMessage
                    .toLowerCase()
                    .includes("duplicate")
            ) {

                errorMessage =
                    "This username is already taken.";

            }


            showMessage(
                errorMessage,
                "error"
            );

        }


        saveButton.disabled =
            false;

        saveButton.textContent =
            "SAVE CHANGES";

    }
);


loadProfile();

</script>

</body>

</html>
