<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Monthly CTF | 0X1GHOST</title>

    <link
        rel="icon"
        type="image/png"
        href="favicon.png"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }


        body {
            min-height: 100vh;

            background: #050505;

            color: white;
        }


        .navbar {
            min-height: 70px;

            border-bottom: 1px solid #222;

            background: #090909;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 12px 35px;

            gap: 20px;
        }


        .logo img {
            display: block;

            width: 150px;

            max-height: 55px;

            object-fit: contain;
        }


        .nav-links {
            display: flex;

            align-items: center;

            gap: 10px;
        }


        .nav-link {
            color: #aaa;

            text-decoration: none;

            padding: 9px 14px;

            border: 1px solid transparent;

            border-radius: 6px;

            transition: 0.2s;
        }


        .nav-link:hover {
            color: #00ff88;

            border-color: #00ff88;
        }


        .container {
            width: 100%;

            max-width: 1000px;

            margin: auto;

            padding: 50px 25px;
        }


        .hero {
            text-align: center;

            margin-bottom: 40px;
        }


        .label {
            color: #00ff88;

            font-size: 12px;

            font-weight: bold;

            letter-spacing: 3px;

            margin-bottom: 15px;
        }


        .title {
            font-size: 38px;

            margin-bottom: 12px;
        }


        .subtitle {
            color: #777;

            line-height: 1.6;
        }


        .competition-box {
            background: #0d0d0d;

            border: 1px solid #222;

            border-radius: 12px;

            padding: 30px;

            margin-bottom: 25px;

            text-align: center;
        }


        .competition-title {
            font-size: 24px;

            margin-bottom: 10px;
        }


        .competition-status {
            display: inline-block;

            color: #00ff88;

            border: 1px solid #00ff88;

            border-radius: 20px;

            padding: 6px 14px;

            font-size: 11px;

            font-weight: bold;

            letter-spacing: 1px;
        }


        .countdown {
            margin-top: 22px;

            color: #888;

            font-family: monospace;

            font-size: 14px;
        }


        .leaderboard {
            background: #0d0d0d;

            border: 1px solid #222;

            border-radius: 12px;

            overflow: hidden;
        }


        .leaderboard-header {
            display: grid;

            grid-template-columns:
                80px
                1fr
                150px
                120px;

            padding: 18px 25px;

            background: #101010;

            border-bottom: 1px solid #222;

            color: #666;

            font-size: 11px;

            font-weight: bold;

            letter-spacing: 1px;
        }


        .player {
            display: grid;

            grid-template-columns:
                80px
                1fr
                150px
                120px;

            align-items: center;

            padding: 20px 25px;

            border-bottom: 1px solid #1c1c1c;

            transition: 0.2s;
        }


        .player:last-child {
            border-bottom: none;
        }


        .player:hover {
            background: #111;
        }


        .rank {
            color: #777;

            font-size: 18px;

            font-weight: bold;
        }


        .rank.first {
            color: #00ff88;

            font-size: 22px;
        }


        .username {
            font-weight: bold;

            font-size: 15px;
        }


        .solves {
            color: #777;

            font-size: 13px;
        }


        .score {
            color: #00ff88;

            font-family: monospace;

            font-weight: bold;

            text-align: right;
        }


        .loading,
        .empty,
        .error {
            padding: 50px 25px;

            text-align: center;

            color: #777;
        }


        .error {
            color: #ff6b6b;
        }


        @media (max-width: 700px) {

            .navbar {
                padding: 15px 18px;
            }


            .nav-links {
                display: none;
            }


            .container {
                padding: 35px 18px;
            }


            .title {
                font-size: 30px;
            }


            .leaderboard-header,
            .player {
                grid-template-columns:
                    55px
                    1fr
                    90px;
            }


            .leaderboard-header div:nth-child(3),
            .player .solves {
                display: none;
            }


            .leaderboard-header div:last-child,
            .player .score {
                text-align: right;
            }

        }

    </style>

</head>


<body>


<nav class="navbar">

    <a
        href="dashboard.html"
        class="logo"
    >

        <img
            src="logo.png"
            alt="0X1GHOST Logo"
        >

    </a>


    <div class="nav-links">

        <a
            href="dashboard.html"
            class="nav-link"
        >
            Dashboard
        </a>

        <a
            href="challenges.html"
            class="nav-link"
        >
            Challenges
        </a>

        <a
            href="scoreboard.html"
            class="nav-link"
        >
            Scoreboard
        </a>

    </div>

</nav>


<main class="container">


    <section class="hero">

        <div class="label">
            0X1GHOST
        </div>

        <h1 class="title">
            MONTHLY CTF
        </h1>

        <p class="subtitle">
            Compete every month. Solve challenges. Reach the top.
        </p>

    </section>


    <section
        id="competitionBox"
        class="competition-box"
    >

        <div
            id="competitionTitle"
            class="competition-title"
        >
            Loading...
        </div>


        <div
            id="competitionStatus"
            class="competition-status"
        >
            LOADING
        </div>


        <div
            id="countdown"
            class="countdown"
        >
            -
        </div>

    </section>


    <section class="leaderboard">


        <div class="leaderboard-header">

            <div>
                RANK
            </div>

            <div>
                PLAYER
            </div>

            <div>
                SOLVES
            </div>

            <div style="text-align:right;">
                POINTS
            </div>

        </div>


        <div
            id="leaderboard"
        >

            <div class="loading">
                Loading leaderboard...
            </div>

        </div>


    </section>


</main>


<script type="module">


import {
    createClient
}
from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


const SUPABASE_URL =
    "https://borturaxifoxufixewya.supabase.co";


const SUPABASE_KEY =
    "sb_publishable__lZmTM96oe10-rurqgrujg__ta_C4wr";


const supabase =
    createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const competitionTitle =
    document.getElementById(
        "competitionTitle"
    );


const competitionStatus =
    document.getElementById(
        "competitionStatus"
    );


const countdownElement =
    document.getElementById(
        "countdown"
    );


const leaderboardElement =
    document.getElementById(
        "leaderboard"
    );


let competitionEnd = null;


async function loadCompetition() {


    const {
        data,
        error
    } = await supabase

        .from(
            "monthly_competitions"
        )

        .select(
            "id, title, month_start, month_end, status"
        )

        .eq(
            "status",
            "active"
        )

        .order(
            "month_start",
            {
                ascending: false
            }
        )

        .limit(1);


    if (error) {

        console.error(error);

        competitionTitle.textContent =
            "Unable to load competition.";

        competitionStatus.textContent =
            "ERROR";

        return;

    }


    if (!data || data.length === 0) {

        competitionTitle.textContent =
            "No active competition.";

        competitionStatus.textContent =
            "OFFLINE";

        countdownElement.textContent =
            "Check back soon.";

        return;

    }


    const competition =
        data[0];


    competitionTitle.textContent =
        competition.title;


    competitionStatus.textContent =
        "ACTIVE";


    competitionEnd =
        new Date(
            competition.month_end +
            "T23:59:59+03:00"
        );


    loadLeaderboard(
        competition.id
    );

}


async function loadLeaderboard(
    competitionId
) {


    const {
        data,
        error
    } = await supabase

        .from(
            "monthly_leaderboard"
        )

        .select(
            "user_id, username, score, solves, rank"
        )

        .eq(
            "competition_id",
            competitionId
        )

        .order(
            "rank",
            {
                ascending: true
            }
        );


    if (error) {

        console.error(error);

        leaderboardElement.innerHTML = `

            <div class="error">
                Unable to load leaderboard.
            </div>

        `;

        return;

    }


    if (!data || data.length === 0) {

        leaderboardElement.innerHTML = `

            <div class="empty">
                No solves yet. Be the first!
            </div>

        `;

        return;

    }


    leaderboardElement.innerHTML =
        data.map(
            player => {

                const rank =
                    Number(
                        player.rank
                    );


                const rankClass =
                    rank === 1
                        ? "rank first"
                        : "rank";


                return `

                    <div class="player">

                        <div class="${rankClass}">
                            #${rank}
                        </div>

                        <div class="username">
                            ${escapeHTML(
                                player.username
                            )}
                        </div>

                        <div class="solves">
                            ${Number(
                                player.solves
                            )} solves
                        </div>

                        <div class="score">
                            ${Number(
                                player.score
                            ).toLocaleString()}
                        </div>

                    </div>

                `;

            }
        ).join("");

}


function updateCountdown() {


    if (!competitionEnd) {
        return;
    }


    const now =
        new Date();


    const difference =
        competitionEnd - now;


    if (difference <= 0) {

        countdownElement.textContent =
            "Competition ended.";

        return;

    }


    const days =
        Math.floor(
            difference /
            (
                1000 *
                60 *
                60 *
                24
            )
        );


    const hours =
        Math.floor(
            (
                difference /
                (
                    1000 *
                    60 *
                    60
                )
            ) % 24
        );


    const minutes =
        Math.floor(
            (
                difference /
                (
                    1000 *
                    60
                )
            ) % 60
        );


    const seconds =
        Math.floor(
            (
                difference /
                1000
            ) % 60
        );


    countdownElement.textContent =
        `${days}D ${hours}H ${minutes}M ${seconds}S REMAINING`;

}


function escapeHTML(
    value
) {

    return String(
        value ?? ""
    )

    .replaceAll(
        "&",
        "&amp;"
    )

    .replaceAll(
        "<",
        "&lt;"
    )

    .replaceAll(
        ">",
        "&gt;"
    )

    .replaceAll(
        '"',
        "&quot;"
    )

    .replaceAll(
        "'",
        "&#039;"
    );

}


loadCompetition();


updateCountdown();


setInterval(
    updateCountdown,
    1000
);


setInterval(
    loadCompetition,
    60000
);


</script>


</body>

</html>
