<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Dashboard | 0X1GHOST</title>

    <link
        rel="icon"
        type="image/png"
        href="favicon.png"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }


        body {
            min-height: 100vh;
            background: #050505;
            color: white;
        }


        .navbar {
            min-height: 70px;

            border-bottom: 1px solid #222;

            background: #090909;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 12px 35px;

            gap: 20px;
        }


        .logo {
            display: flex;

            align-items: center;

            text-decoration: none;
        }


        .logo img {
            display: block;

            width: 150px;

            max-height: 55px;

            object-fit: contain;
        }


        .admin-label {
            color: #00ff88;

            font-size: 12px;

            font-weight: bold;

            letter-spacing: 2px;
        }


        .nav-right {
            display: flex;

            align-items: center;

            gap: 15px;
        }


        .back-btn,
        .logout-btn {

            background: transparent;

            color: #aaa;

            border: 1px solid #333;

            padding: 9px 15px;

            border-radius: 6px;

            cursor: pointer;

            text-decoration: none;

            transition: 0.2s;
        }


        .back-btn:hover {
            color: #00ff88;

            border-color: #00ff88;
        }


        .logout-btn:hover {
            color: #ff6b6b;

            border-color: #ff6b6b;
        }


        .container {

            width: 100%;

            max-width: 1200px;

            margin: auto;

            padding: 45px 25px;
        }


        .header {

            margin-bottom: 30px;
        }


        .header h1 {

            font-size: 32px;

            margin-bottom: 8px;
        }


        .header h1 span {

            color: #00ff88;
        }


        .header p {

            color: #777;

            line-height: 1.6;
        }


        .message {

            display: none;

            padding: 15px;

            margin-bottom: 25px;

            border-radius: 7px;

            line-height: 1.5;
        }


        .message.error {

            display: block;

            color: #ff6b6b;

            background:
                rgba(255, 107, 107, 0.08);

            border:
                1px solid #ff6b6b;
        }


        .message.success {

            display: block;

            color: #00ff88;

            background:
                rgba(0, 255, 136, 0.08);

            border:
                1px solid #00ff88;
        }


        .stats {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 18px;

            margin-bottom: 30px;
        }


        .stat-card {

            background: #0d0d0d;

            border: 1px solid #222;

            border-radius: 10px;

            padding: 25px;
        }


        .stat-title {

            color: #777;

            font-size: 13px;

            margin-bottom: 10px;
        }


        .stat-value {

            color: #00ff88;

            font-size: 28px;

            font-weight: bold;
        }


        .players-box {

            background: #0d0d0d;

            border: 1px solid #222;

            border-radius: 12px;

            overflow: hidden;
        }


        .players-header {

            padding: 22px 25px;

            border-bottom: 1px solid #222;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;
        }


        .players-header h2 {

            font-size: 20px;
        }


        .refresh-btn {

            background: transparent;

            color: #00ff88;

            border: 1px solid #00ff88;

            padding: 8px 14px;

            border-radius: 6px;

            cursor: pointer;

            font-weight: bold;

            transition: 0.2s;
        }


        .refresh-btn:hover {

            background: #00ff88;

            color: #050505;
        }


        .table-wrapper {

            width: 100%;

            overflow-x: auto;
        }


        table {

            width: 100%;

            border-collapse: collapse;

            min-width: 800px;
        }


        th {

            text-align: left;

            color: #777;

            font-size: 12px;

            letter-spacing: 1px;

            padding: 16px;

            border-bottom: 1px solid #222;
        }


        td {

            padding: 16px;

            border-bottom: 1px solid #191919;

            color: #ccc;

            font-size: 14px;
        }


        tr:last-child td {

            border-bottom: none;
        }


        .username {

            color: white;

            font-weight: bold;
        }


        .score {

            color: #00ff88;

            font-weight: bold;
        }


        .solved {

            color: #aaa;
        }


        .status {

            font-size: 11px;

            font-weight: bold;

            padding: 5px 9px;

            border-radius: 5px;

            display: inline-block;
        }


        .status.active {

            color: #00ff88;

            border: 1px solid #00ff88;

            background:
                rgba(0, 255, 136, 0.05);
        }


        .status.banned {

            color: #ff6b6b;

            border: 1px solid #ff6b6b;

            background:
                rgba(255, 107, 107, 0.05);
        }


        .ban-btn {

            background: transparent;

            color: #ff6b6b;

            border: 1px solid #ff6b6b;

            padding: 7px 12px;

            border-radius: 6px;

            cursor: pointer;

            font-size: 11px;

            font-weight: bold;

            transition: 0.2s;
        }


        .ban-btn:hover {

            background: #ff6b6b;

            color: #050505;
        }


        .unban-btn {

            background: transparent;

            color: #00ff88;

            border: 1px solid #00ff88;

            padding: 7px 12px;

            border-radius: 6px;

            cursor: pointer;

            font-size: 11px;

            font-weight: bold;

            transition: 0.2s;
        }


        .unban-btn:hover {

            background: #00ff88;

            color: #050505;
        }


        .loading {

            text-align: center;

            padding: 40px;

            color: #777;
        }


        .empty {

            text-align: center;

            padding: 40px;

            color: #777;
        }


        @media (max-width: 800px) {

            .navbar {

                padding: 15px 18px;

                flex-direction: column;

                align-items: flex-start;
            }


            .nav-right {

                width: 100%;

                justify-content: flex-start;

                flex-wrap: wrap;
            }


            .stats {

                grid-template-columns: 1fr;
            }


            .container {

                padding: 30px 18px;
            }


            .logo img {

                width: 130px;
            }
        }

    </style>

</head>


<body>


<nav class="navbar">


    <a
        href="dashboard.html"
        class="logo"
    >

        <img
            src="logo.png"
            alt="0X1GHOST Logo"
        >

    </a>


    <div class="nav-right">

        <span class="admin-label">
            ADMIN PANEL
        </span>


        <a
            href="dashboard.html"
            class="back-btn"
        >
            DASHBOARD
        </a>


        <button
            class="logout-btn"
            id="logoutButton"
        >
            LOGOUT
        </button>

    </div>


</nav>



<main class="container">


    <div class="header">

        <h1>
            Admin
            <span>Dashboard</span>
        </h1>

        <p>
            Manage players, view scores,
            solved challenges and account status.
        </p>

    </div>


    <div
        id="message"
        class="message"
    ></div>



    <div class="stats">


        <div class="stat-card">

            <div class="stat-title">
                TOTAL PLAYERS
            </div>

            <div
                class="stat-value"
                id="totalPlayers"
            >
                0
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-title">
                ACTIVE PLAYERS
            </div>

            <div
                class="stat-value"
                id="activePlayers"
            >
                0
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-title">
                BANNED PLAYERS
            </div>

            <div
                class="stat-value"
                id="bannedPlayers"
            >
                0
            </div>

        </div>


    </div>



    <div class="players-box">


        <div class="players-header">

            <h2>
                PLAYERS
            </h2>


            <button
                class="refresh-btn"
                id="refreshButton"
            >
                REFRESH
            </button>

        </div>


        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>
                            USERNAME
                        </th>

                        <th>
                            EMAIL
                        </th>

                        <th>
                            SCORE
                        </th>

                        <th>
                            SOLVED
                        </th>

                        <th>
                            STATUS
                        </th>

                        <th>
                            ACTION
                        </th>

                    </tr>

                </thead>


                <tbody
                    id="playersTable"
                >

                    <tr>

                        <td
                            colspan="6"
                            class="loading"
                        >
                            Loading players...
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>


    </div>


</main>



<script type="module">


import {
    createClient
}
from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";



/* =========================================================
   SUPABASE
   ========================================================= */


const SUPABASE_URL =
    "https://borturaxifoxufixewya.supabase.co";


const SUPABASE_KEY =
    "sb_publishable__lZmTM96oe10-rurqgrujg__ta_C4wr";


const supabase =
    createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );



/* =========================================================
   ELEMENTS
   ========================================================= */


const playersTable =
    document.getElementById(
        "playersTable"
    );


const totalPlayers =
    document.getElementById(
        "totalPlayers"
    );


const activePlayers =
    document.getElementById(
        "activePlayers"
    );


const bannedPlayers =
    document.getElementById(
        "bannedPlayers"
    );


const message =
    document.getElementById(
        "message"
    );


const refreshButton =
    document.getElementById(
        "refreshButton"
    );


const logoutButton =
    document.getElementById(
        "logoutButton"
    );



/* =========================================================
   MESSAGE
   ========================================================= */


function showMessage(
    text,
    type
) {

    message.textContent =
        text;

    message.className =
        "message " + type;

}



/* =========================================================
   CHECK ADMIN
   ========================================================= */


async function checkAdmin() {


    const {
        data: {
            user
        },
        error: userError
    } =
    await supabase.auth.getUser();


    if (
        userError ||
        !user
    ) {

        window.location.href =
            "index.html";

        return false;

    }


    const {
        data: isAdmin,
        error: adminError
    } =
    await supabase.rpc(
        "is_current_user_admin"
    );


    if (
        adminError ||
        !isAdmin
    ) {

        window.location.href =
            "dashboard.html";

        return false;

    }


    return true;

}



/* =========================================================
   LOAD PLAYERS
   ========================================================= */


async function loadPlayers() {


    playersTable.innerHTML = `

        <tr>

            <td
                colspan="6"
                class="loading"
            >
                Loading players...
            </td>

        </tr>

    `;


    const {
        data,
        error
    } =
    await supabase.rpc(
        "admin_get_players"
    );


    if (error) {

        console.error(error);

        showMessage(
            error.message ||
            "Could not load players.",
            "error"
        );

        playersTable.innerHTML = `

            <tr>

                <td
                    colspan="6"
                    class="empty"
                >
                    Failed to load players.
                </td>

            </tr>

        `;

        return;

    }


    const players =
        data || [];


    totalPlayers.textContent =
        players.length;


    const active =
        players.filter(
            player =>
                !player.is_banned
        ).length;


    const banned =
        players.filter(
            player =>
                player.is_banned
        ).length;


    activePlayers.textContent =
        active;


    bannedPlayers.textContent =
        banned;


    if (
        players.length === 0
    ) {

        playersTable.innerHTML = `

            <tr>

                <td
                    colspan="6"
                    class="empty"
                >
                    No players found.
                </td>

            </tr>

        `;

        return;

    }


    playersTable.innerHTML =
        players
            .map(
                player => {


                    const status =
                        player.is_banned
                            ? `
                                <span class="status banned">
                                    BANNED
                                </span>
                              `
                            : `
                                <span class="status active">
                                    ACTIVE
                                </span>
                              `;


                    const action =
                        player.is_banned

                            ? `
                                <button
                                    class="unban-btn"
                                    data-id="${player.id}"
                                    data-action="unban"
                                >
                                    UNBAN
                                </button>
                              `

                            : `
                                <button
                                    class="ban-btn"
                                    data-id="${player.id}"
                                    data-action="ban"
                                >
                                    BAN
                                </button>
                              `;


                    return `

                        <tr>

                            <td>
                                <span class="username">
                                    ${escapeHTML(
                                        player.username ||
                                        "Player"
                                    )}
                                </span>
                            </td>


                            <td>
                                ${escapeHTML(
                                    player.email ||
                                    "-"
                                )}
                            </td>


                            <td>
                                <span class="score">
                                    ${Number(
                                        player.score || 0
                                    )}
                                </span>
                            </td>


                            <td>
                                <span class="solved">
                                    ${Number(
                                        player.solved_count || 0
                                    )}
                                </span>
                            </td>


                            <td>
                                ${status}
                            </td>


                            <td>
                                ${action}
                            </td>

                        </tr>

                    `;

                }
            )
            .join("");


    attachActionButtons();

}



/* =========================================================
   BAN / UNBAN
   ========================================================= */


function attachActionButtons() {


    document
        .querySelectorAll(
            "[data-action]"
        )
        .forEach(
            button => {


                button.addEventListener(
                    "click",
                    async function() {


                        const userId =
                            this.dataset.id;


                        const action =
                            this.dataset.action;


                        const functionName =
                            action === "ban"
                                ? "admin_ban_player"
                                : "admin_unban_player";


                        const confirmText =
                            action === "ban"
                                ? "Are you sure you want to ban this player?"
                                : "Are you sure you want to unban this player?";


                        if (
                            !confirm(
                                confirmText
                            )
                        ) {

                            return;

                        }


                        this.disabled =
                            true;


                        this.textContent =
                            "...";


                        const {
                            error
                        } =
                        await supabase.rpc(
                            functionName,
                            {
                                target_user_id:
                                    userId
                            }
                        );


                        if (error) {

                            console.error(error);

                            showMessage(
                                error.message ||
                                "Action failed.",
                                "error"
                            );

                            this.disabled =
                                false;

                            return;

                        }


                        showMessage(
                            action === "ban"
                                ? "Player banned successfully."
                                : "Player unbanned successfully.",
                            "success"
                        );


                        await loadPlayers();

                    }
                );

            }
        );

}



/* =========================================================
   REFRESH
   ========================================================= */


refreshButton.addEventListener(
    "click",
    async function() {

        refreshButton.disabled =
            true;

        refreshButton.textContent =
            "LOADING...";


        await loadPlayers();


        refreshButton.disabled =
            false;

        refreshButton.textContent =
            "REFRESH";

    }
);



/* =========================================================
   LOGOUT
   ========================================================= */


logoutButton.addEventListener(
    "click",
    async function() {


        logoutButton.disabled =
            true;

        logoutButton.textContent =
            "LOGGING OUT...";


        const {
            error
        } =
        await supabase.auth.signOut();


        if (error) {

            console.error(error);

            logoutButton.disabled =
                false;

            logoutButton.textContent =
                "LOGOUT";

            return;

        }


        window.location.href =
            "index.html";

    }
);



/* =========================================================
   ESCAPE HTML
   ========================================================= */


function escapeHTML(
    value
) {

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}



/* =========================================================
   START
   ========================================================= */


async function start() {


    const allowed =
        await checkAdmin();


    if (!allowed) {

        return;

    }


    await loadPlayers();

}


start();


</script>


</body>

</html>
