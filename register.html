<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | 0X1GHOST</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #050505;
            color: white;
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .card {
            background: #0d0d0d;
            border: 1px solid #222;
            border-radius: 12px;
            padding: 40px 35px;
            box-shadow: 0 0 35px rgba(0, 255, 136, 0.08);
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 3px;
            color: #00ff88;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-bottom: 35px;
        }

        .title {
            text-align: center;
            font-size: 22px;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #aaa;
            font-size: 14px;
        }

        .input-group input {
            width: 100%;
            padding: 13px 14px;
            background: #080808;
            border: 1px solid #292929;
            border-radius: 7px;
            color: white;
            outline: none;
            font-size: 15px;
            transition: 0.2s;
        }

        .input-group input:focus {
            border-color: #00ff88;
            box-shadow: 0 0 8px rgba(0, 255, 136, 0.15);
        }

        .register-btn {
            width: 100%;
            padding: 13px;
            margin-top: 8px;
            border: none;
            border-radius: 7px;
            background: #00ff88;
            color: #050505;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .register-btn:hover {
            background: #00e67a;
            transform: translateY(-1px);
        }

        #message {
            text-align: center;
            margin-top: 18px;
            font-size: 14px;
            min-height: 20px;
        }

        .login-link {
            text-align: center;
            margin-top: 25px;
            color: #777;
            font-size: 14px;
        }

        .login-link a {
            color: #00ff88;
            text-decoration: none;
            font-weight: bold;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .terms {
            text-align: center;
            margin-top: 18px;
            color: #555;
            font-size: 11px;
            line-height: 1.5;
        }

        @media (max-width: 480px) {
            .card {
                padding: 30px 22px;
            }

            .logo {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="card">

            <div class="logo">0X1GHOST</div>

            <div class="subtitle">
                CRYPTOGRAPHY CHALLENGE PLATFORM
            </div>

            <div class="title">
                Create Account
            </div>

            <form onsubmit="register(event)">

                <div class="input-group">
                    <label for="username">Username</label>
                    <input
                        type="text"
                        id="username"
                        placeholder="Enter your username"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >
                </div>

                <button type="submit" class="register-btn">
                    REGISTER
                </button>

            </form>

            <div id="message"></div>

            <div class="login-link">
                Already have an account?
                <a href="index.html">Login</a>
            </div>

            <div class="terms">
                By creating an account, you agree to the platform rules.
            </div>

        </div>

    </div>

    <script>
        function register(event) {
            event.preventDefault();

            const username = document.getElementById("username").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;
            const message = document.getElementById("message");

            if (password !== confirmPassword) {
                message.style.color = "#ff6b6b";
                message.textContent = "Passwords do not match.";
                return;
            }

            if (password.length < 6) {
                message.style.color = "#ff6b6b";
                message.textContent = "Password must be at least 6 characters.";
                return;
            }

            message.style.color = "#00ff88";
            message.textContent = "Registration successful!";

            console.log("Username:", username);
            console.log("Email:", email);
        }
    </script>

</body>
</html>
